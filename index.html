<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chopstick Making by RuangQu Makerspace</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Firebase JS SDK Compat (Safe & Stable for single HTML) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F9F7F2] text-[#2D2A26] font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- MAP FOTO DARI UPLOAD KAMU ---
    const APP_IMAGES = {
      HERO_IMAGE: './Hero image.png',
      INDIVIDUAL_CLASS_IMAGE: './individual class.png',
      GROUP_CLASS_IMAGE: './group class.png',
      ON_SITE_IMAGE: './We Come To You  On-Site.png',
      PROCESS_IMAGE_01: './choose.jpeg',
      PROCESS_IMAGE_02: './hand plane.jpeg',
      PROCESS_IMAGE_03: './smooth.jpg',
      FINISHED_CHOPSTICKS_IMAGE: './oil.jpeg',
    };

    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDemoPlaceholderKeyForRuangQu12345",
      authDomain: "chopstick-makerspace.firebaseapp.com",
      projectId: "chopstick-makerspace",
      storageBucket: "chopstick-makerspace.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const appId = 'chopstick-making-app';

    const getCol = (colName) => db.collection('artifacts').doc(appId).collection('publicData').doc('data').collection(colName);
    const getDocRef = (colName, docId) => getCol(colName).doc(docId);

    // --- UTILS ---
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);
    };

    const formatDate = (dateString) => {
      if (!dateString) return '';
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('en-US', options);
    };

    const generateBookingId = () => 'CHP-' + Math.floor(10000 + Math.random() * 90000);
    const HOLD_DURATION_MS = 15 * 60 * 1000;

    const theme = {
      bg: 'bg-[#F9F7F2]',
      text: 'text-[#2D2A26]',
      textMuted: 'text-[#5C5A56]',
      primary: 'bg-[#8B5A2B]',
      primaryHover: 'hover:bg-[#704822]',
      secondary: 'bg-[#E8E1D5]',
      border: 'border-[#E8E1D5]',
      card: 'bg-white',
    };

    // --- COMPONENT FOTO DENGAN FALLBACK AMAN ---
    const PlaceholderImage = ({ label, className = "", style = {} }) => {
      const [imgError, setImgError] = useState(false);
      const imgSrc = APP_IMAGES[label];

      if (imgSrc && !imgError) {
        return (
          <img 
            src={imgSrc} 
            alt={label} 
            onError={() => setImgError(true)}
            className={`object-cover ${className}`} 
            style={style} 
          />
        );
      }

      return (
        <div className={`flex items-center justify-center bg-[#E8E1D5] text-[#8B5A2B] font-mono text-xs text-center p-4 border border-[#D8C1B5] border-dashed select-none ${className}`} style={style}>
          {label}
        </div>
      );
    };

    // --- SVG ICONS ---
    const IconCalendar = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const IconClock = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconUsers = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const IconArrowRight = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
    const IconCheckCircle = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconChevronRight = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>;
    const IconMenu = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
    const IconX = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconMapPin = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>;
    const IconLock = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const IconCreditCard = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>;
    const IconAlertCircle = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const IconDashboard = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>;
    const IconLogOut = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;

    // --- PAYMENT SERVICE ABSTRACTION ---
    const paymentService = {
      mode: 'MOCK',
      createPayment: async ({ bookingId, customerName, customerEmail, customerPhone, amount, description }) => {
        await new Promise(r => setTimeout(r, 600));
        return {
          success: true,
          paymentProvider: 'MOCK',
          paymentId: `MOCK-${bookingId}-${Date.now().toString().slice(-4)}`,
          paymentUrl: `mock-checkout://${bookingId}`,
          status: 'PENDING_PAYMENT',
          paymentExpiresAt: Date.now() + HOLD_DURATION_MS
        };
      },
      verifyAndConfirmBooking: async (bookingDocId, sessionId, participants) => {
        const bookingRef = getDocRef('bookings', bookingDocId);
        const sessionRef = getDocRef('sessions', sessionId);

        await bookingRef.update({
          paymentStatus: 'PAID',
          bookingStatus: 'CONFIRMED',
          paidAt: Date.now()
        });

        if (sessionRef && sessionId) {
          const snap = await sessionRef.get();
          if (snap.exists) {
            const currentBooked = snap.data().booked || 0;
            await sessionRef.update({
              booked: currentBooked + participants
            });
          }
        }
      }
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [authUser, setAuthUser] = useState(null);
      const [adminProfile, setAdminProfile] = useState(null);
      const [currentView, setCurrentView] = useState('home');
      const [activeBooking, setActiveBooking] = useState(null);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const [products, setProducts] = useState({
        individual: { price: 175000, name: 'Individual Class' },
        group: { price: 150000, name: 'Group Class' },
        onsite: { price: 200000, name: 'We Come To You' }
      });
      const [sessions, setSessions] = useState([]);
      const [bookings, setBookings] = useState([]);
      const [requests, setRequests] = useState([]);

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});
        const unsub = auth.onAuthStateChanged((user) => {
          setAuthUser(user);
          if (user && !user.isAnonymous) {
            if (user.email === 'admin@ruangqu.com') {
              setAdminProfile({ uid: user.uid, email: user.email, role: 'admin', name: 'RuangQu Admin' });
            }
          }
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        const sampleSessions = [
          { id: 's1', date: '2026-09-12', startTime: '10:00', endTime: '11:00', capacity: 10, booked: 2, status: 'OPEN', sessionType: 'INDIVIDUAL' },
          { id: 's2', date: '2026-09-12', startTime: '13:00', endTime: '14:00', capacity: 10, booked: 9, status: 'OPEN', sessionType: 'INDIVIDUAL' },
          { id: 's3', date: '2026-09-13', startTime: '11:00', endTime: '12:00', capacity: 10, booked: 10, status: 'FULL', sessionType: 'INDIVIDUAL' },
          { id: 's4', date: '2026-09-13', startTime: '15:00', endTime: '16:00', capacity: 10, booked: 0, status: 'OPEN', sessionType: 'INDIVIDUAL' },
        ];
        setSessions(sampleSessions);
      }, []);

      const calculateAvailableSpots = async (session) => {
        if (!session) return 0;
        const remaining = Math.max(0, session.capacity - (session.booked || 0));
        return remaining;
      };

      const navigate = (view, data = null) => {
        if (view === 'admin' && !adminProfile) {
          setCurrentView('admin_login');
          return;
        }
        setCurrentView(view);
        if (data) setActiveBooking(data);
        window.scrollTo(0, 0);
        setIsMobileMenuOpen(false);
      };

      // --- NAVBAR ---
      const Navbar = () => (
        <nav className={`sticky top-0 z-50 ${theme.bg} ${theme.border} border-b px-4 md:px-8 py-3.5 flex justify-between items-center shadow-sm`}>
          <div className="flex items-center gap-3 cursor-pointer" onClick={() => navigate('home')}>
            <div className={`w-8 h-8 ${theme.primary} rounded flex items-center justify-center text-white font-bold tracking-widest text-xs shadow-inner`}>RQ</div>
            <div>
              <span className="font-semibold tracking-wider text-sm md:text-base block leading-none">CHOPSTICK MAKING</span>
              <span className="text-[10px] text-[#8B5A2B] tracking-widest uppercase">by RuangQu</span>
            </div>
          </div>
          
          <div className="hidden md:flex gap-7 text-xs font-medium tracking-wider">
            <button onClick={() => navigate('home')} className={`${theme.textMuted} hover:${theme.text} transition`}>EXPERIENCES</button>
            <button onClick={() => navigate('lookup')} className={`${theme.textMuted} hover:${theme.text} transition`}>MANAGE BOOKING</button>
            {adminProfile ? (
              <button onClick={() => navigate('admin')} className="text-[#8B5A2B] font-semibold flex items-center gap-1.5 bg-[#E8E1D5] px-3 py-1.5 rounded-full">
                <IconDashboard size={13}/> DASHBOARD
              </button>
            ) : (
              <button onClick={() => navigate('admin_login')} className={`${theme.textMuted} hover:${theme.text} transition flex items-center gap-1`}>
                <IconLock size={12}/> ADMIN
              </button>
            )}
          </div>

          <div className="md:hidden flex items-center">
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-1">
              {isMobileMenuOpen ? <IconX size={22} /> : <IconMenu size={22} />}
            </button>
          </div>

          {isMobileMenuOpen && (
            <div className={`absolute top-[60px] left-0 w-full ${theme.bg} border-b ${theme.border} flex flex-col p-5 shadow-xl md:hidden z-50`}>
              <button onClick={() => navigate('home')} className="py-3 text-left border-b border-stone-200 text-sm font-medium">Experiences</button>
              <button onClick={() => navigate('lookup')} className="py-3 text-left border-b border-stone-200 text-sm font-medium">Manage Your Booking</button>
              {adminProfile ? (
                <button onClick={() => navigate('admin')} className="py-3 text-left text-[#8B5A2B] font-semibold text-sm flex items-center gap-2">
                  <IconDashboard size={16}/> Admin Dashboard
                </button>
              ) : (
                <button onClick={() => navigate('admin_login')} className="py-3 text-left text-sm flex items-center gap-2 text-stone-600">
                  <IconLock size={16}/> Admin Login
                </button>
              )}
            </div>
          )}
        </nav>
      );

      const Footer = () => (
        <footer className={`${theme.primary} text-white py-12 px-6 text-center mt-auto`}>
          <div className="max-w-4xl mx-auto flex flex-col items-center gap-5">
            <div className="w-10 h-10 bg-white/10 rounded flex items-center justify-center text-sm font-bold tracking-widest">RQ</div>
            <p className="text-white/80 max-w-md text-xs md:text-sm leading-relaxed">
              A hands-on woodworking experience where you shape, smooth and personalize your own pair of wooden chopsticks.
            </p>
            <div className="text-white/50 text-[11px] mt-4 border-t border-white/10 pt-4 w-full">
              &copy; {new Date().getFullYear()} RuangQu Makerspace. All rights reserved. • Approx. 45–60 mins per session
            </div>
          </div>
        </footer>
      );

      // --- HOME VIEW ---
      const HomeView = () => (
        <div className="flex flex-col min-h-screen">
          <Navbar />
          
          <section className="relative pt-10 pb-16 md:py-20 px-4 md:px-8 max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-10 md:gap-12">
            <div className="flex-1 space-y-5 text-center md:text-left">
              <div className="inline-flex items-center gap-2 px-3 py-1 bg-[#E8E1D5] text-[#8B5A2B] text-[11px] font-semibold tracking-widest rounded-full">
                <span>RUANGQU MAKERSPACE</span> • <span>JAKARTA</span>
              </div>
              <h1 className="text-4xl md:text-6xl font-light tracking-tight text-[#2D2A26] leading-tight">
                Make your own <br/><span className="font-serif italic font-normal">chopsticks.</span>
              </h1>
              <p className="text-sm md:text-base text-[#5C5A56] max-w-md mx-auto md:mx-0 leading-relaxed">
                Shape it. Smooth it. Make it yours. A hands-on woodworking experience taking approximately 45–60 minutes.
              </p>
              <div className="flex flex-col sm:flex-row gap-3.5 pt-2 justify-center md:justify-start">
                <button onClick={() => document.getElementById('experiences').scrollIntoView({ behavior: 'smooth' })} className={`${theme.primary} ${theme.primaryHover} text-white px-7 py-3.5 rounded-md font-medium text-xs tracking-wider transition flex items-center justify-center gap-2 shadow-md`}>
                  BOOK YOUR EXPERIENCE <IconArrowRight size={16} />
                </button>
                <button onClick={() => document.getElementById('how-it-works').scrollIntoView({ behavior: 'smooth' })} className="border border-[#2D2A26] text-[#2D2A26] hover:bg-stone-100 px-6 py-3.5 rounded-md font-medium text-xs tracking-wider transition">
                  HOW IT WORKS
                </button>
              </div>
            </div>
            <div className="flex-1 w-full relative max-w-lg md:max-w-none">
              <PlaceholderImage label="HERO_IMAGE" className="w-full aspect-[4/3] rounded-lg shadow-xl" />
              <div className="absolute -bottom-4 -left-4 md:-bottom-6 md:-left-6 bg-white p-3.5 md:p-4 rounded-lg shadow-lg flex items-center gap-3 border border-[#E8E1D5]">
                <div className="bg-[#E8E1D5] text-[#8B5A2B] p-2 rounded-full"><IconClock size={18}/></div>
                <div>
                  <p className="text-[10px] text-stone-500 uppercase tracking-wider">Duration</p>
                  <p className="font-semibold text-xs md:text-sm">45–60 Minutes</p>
                </div>
              </div>
            </div>
          </section>

          <section id="experiences" className="py-16 md:py-20 px-4 bg-white border-y border-[#E8E1D5]">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-2xl md:text-3xl font-medium tracking-tight mb-2">Choose Your Experience</h2>
                <p className="text-xs md:text-sm text-[#5C5A56] max-w-md mx-auto">Select a public workshop, reserve a private group session, or have us come to your venue.</p>
              </div>

              <div className="grid md:grid-cols-3 gap-6 md:gap-8">
                {/* Individual */}
                <div className="bg-[#F9F7F2] rounded-xl overflow-hidden border border-[#E8E1D5] flex flex-col hover:shadow-md transition">
                  <PlaceholderImage label="INDIVIDUAL_CLASS_IMAGE" className="h-48 w-full" />
                  <div className="p-6 flex flex-col flex-grow">
                    <div className="flex justify-between items-start mb-2">
                      <h3 className="text-lg font-medium">Individual Class</h3>
                      <span className="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-medium">Popular</span>
                    </div>
                    <p className="text-xs text-[#5C5A56] mb-5 flex-grow leading-relaxed">
                      Join a public workshop at RuangQu. Perfect for solo makers, couples, or pairs. 
                    </p>
                    <div className="border-t border-[#E8E1D5] pt-4 mb-5">
                      <p className="font-semibold text-lg">{formatCurrency(products.individual?.price)} <span className="text-xs font-normal text-[#5C5A56]">/ person</span></p>
                      <p className="text-[11px] text-[#5C5A56] mt-0.5">1–10 spots per session • 45–60 mins</p>
                    </div>
                    <button onClick={() => navigate('individual')} className={`w-full ${theme.primary} ${theme.primaryHover} text-white py-3 rounded-md font-medium text-xs tracking-wider transition`}>
                      BOOK INDIVIDUAL
                    </button>
                  </div>
                </div>

                {/* Group */}
                <div className="bg-[#F9F7F2] rounded-xl overflow-hidden border border-[#E8E1D5] flex flex-col hover:shadow-md transition">
                  <PlaceholderImage label="GROUP_CLASS_IMAGE" className="h-48 w-full" />
                  <div className="p-6 flex flex-col flex-grow">
                    <h3 className="text-lg font-medium mb-2">Group Class</h3>
                    <p className="text-xs text-[#5C5A56] mb-5 flex-grow leading-relaxed">
                      Private studio experience for birthdays, family gatherings, team building, or community events.
                    </p>
                    <div className="border-t border-[#E8E1D5] pt-4 mb-5">
                      <p className="font-semibold text-lg">{formatCurrency(products.group?.price)} <span className="text-xs font-normal text-[#5C5A56]">/ person</span></p>
                      <p className="text-[11px] text-[#5C5A56] mt-0.5">Min. 10 pax, max 20 pax</p>
                    </div>
                    <button onClick={() => navigate('group')} className={`w-full bg-[#2D2A26] hover:bg-stone-900 text-white py-3 rounded-md font-medium text-xs tracking-wider transition`}>
                      BOOK PRIVATE GROUP
                    </button>
                  </div>
                </div>

                {/* On-Site */}
                <div className="bg-[#F9F7F2] rounded-xl overflow-hidden border border-[#E8E1D5] flex flex-col hover:shadow-md transition">
                  <PlaceholderImage label="ON_SITE_IMAGE" className="h-48 w-full" />
                  <div className="p-6 flex flex-col flex-grow">
                    <h3 className="text-lg font-medium mb-2">We Come To You</h3>
                    <p className="text-xs text-[#5C5A56] mb-5 flex-grow leading-relaxed">
                      We bring our mobile woodworking tools & materials to your office, school, or venue in Jabodetabek.
                    </p>
                    <div className="border-t border-[#E8E1D5] pt-4 mb-5">
                      <p className="font-semibold text-lg">{formatCurrency(products.onsite?.price)} <span className="text-xs font-normal text-[#5C5A56]">/ person</span></p>
                      <p className="text-[11px] text-[#5C5A56] mt-0.5">Min. 10 pax + Custom transport fee</p>
                    </div>
                    <button onClick={() => navigate('onsite')} className={`w-full bg-white border border-[#2D2A26] text-[#2D2A26] hover:bg-stone-50 py-3 rounded-md font-medium text-xs tracking-wider transition`}>
                      REQUEST ON-SITE EVENT
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="how-it-works" className="py-16 md:py-20 px-4">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-2xl md:text-3xl font-medium tracking-tight mb-2">How It Works</h2>
                <p className="text-xs md:text-sm text-[#5C5A56]">Four simple steps to your custom handcrafted chopsticks.</p>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                {[
                  { label: 'PROCESS_IMAGE_01', num: '01', title: 'Choose Wood', desc: 'Select your preferred hardwood blank.' },
                  { label: 'PROCESS_IMAGE_02', num: '02', title: 'Hand Plane', desc: 'Shape the taper using traditional hand planes.' },
                  { label: 'PROCESS_IMAGE_03', num: '03', title: 'Smooth & Sand', desc: 'Progressively sand to an ultra-smooth finish.' },
                  { label: 'FINISHED_CHOPSTICKS_IMAGE', num: '04', title: 'Oil & Take Home', desc: 'Apply natural food-safe beeswax oil & use!' }
                ].map((st, i) => (
                  <div key={i} className="bg-white p-4 rounded-xl border border-[#E8E1D5] text-center flex flex-col items-center">
                    <PlaceholderImage label={st.label} className="w-full aspect-square rounded-lg mb-3" />
                    <span className="text-lg font-serif text-[#8B5A2B] font-bold block mb-1">{st.num}</span>
                    <h4 className="font-medium text-xs md:text-sm mb-1">{st.title}</h4>
                    <p className="text-[11px] text-[#5C5A56]">{st.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <Footer />
        </div>
      );

      // --- INDIVIDUAL BOOKING ---
      const IndividualBookingFlow = () => {
        const [step, setStep] = useState(1);
        const [selectedDate, setSelectedDate] = useState('');
        const [selectedSession, setSelectedSession] = useState(null);
        const [participants, setParticipants] = useState(1);
        const [maxAvailable, setMaxAvailable] = useState(10);
        const [formData, setFormData] = useState({ name: '', whatsapp: '', email: '' });
        const [errorMsg, setErrorMsg] = useState('');

        const product = products.individual;
        const uniqueDates = [...new Set(sessions.map(s => s.date))].sort();
        const availableSessions = sessions.filter(s => s.date === selectedDate);

        const handleSelectSession = (session) => {
          setSelectedSession(session);
          const avail = Math.max(0, session.capacity - (session.booked || 0));
          setMaxAvailable(avail);
          if (participants > avail) {
            setParticipants(avail > 0 ? avail : 1);
          }
        };

        const handleContinueToDetails = () => {
          if (!selectedSession) return;
          if (participants > maxAvailable) {
            setErrorMsg(`Hanya tersisa ${maxAvailable} tempat untuk sesi ini.`);
            return;
          }
          setErrorMsg('');
          setStep(2);
        };

        const handleCreateHoldAndPay = async () => {
          if (!formData.name || !formData.whatsapp) {
            setErrorMsg("Nama dan Nomor WhatsApp wajib diisi.");
            return;
          }

          const bookingId = generateBookingId();
          const total = participants * product.price;

          const paymentResp = await paymentService.createPayment({
            bookingId,
            customerName: formData.name,
            customerEmail: formData.email,
            customerPhone: formData.whatsapp,
            amount: total,
            description: `Individual Chopstick Class (${participants} pax)`
          });

          const bookingRecord = {
            id: 'b_' + Date.now(),
            bookingId,
            displayId: bookingId,
            customerName: formData.name,
            whatsapp: formData.whatsapp,
            email: formData.email,
            bookingType: 'INDIVIDUAL',
            sessionId: selectedSession.id,
            date: selectedSession.date,
            time: selectedSession.startTime,
            participants,
            pricePerPerson: product.price,
            total,
            bookingStatus: 'PENDING_PAYMENT',
            paymentStatus: 'PENDING',
            paymentExpiresAt: paymentResp.paymentExpiresAt
          };

          navigate('mock_payment', bookingRecord);
        };

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="max-w-3xl mx-auto w-full px-4 py-8 flex-grow">
              <button onClick={() => step > 1 ? setStep(step-1) : navigate('home')} className="flex items-center gap-1.5 text-xs font-medium mb-6 hover:opacity-75 transition">
                <IconChevronRight className="rotate-180" size={14}/> Back
              </button>
              
              <div className="bg-white p-6 md:p-10 rounded-xl shadow-sm border border-[#E8E1D5]">
                <h2 className="text-2xl font-medium mb-1">Book Individual Class</h2>
                <p className="text-xs text-[#5C5A56] mb-6">{formatCurrency(product.price)} / person • Max 10 spots per session</p>

                {errorMsg && (
                  <div className="bg-red-50 text-red-700 p-3 rounded-md text-xs mb-6 border border-red-200 flex items-center gap-2">
                    <IconAlertCircle size={16}/> <span>{errorMsg}</span>
                  </div>
                )}

                {step === 1 && (
                  <div className="space-y-6">
                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">1. Choose Date</label>
                      <div className="flex flex-wrap gap-2.5">
                        {uniqueDates.map(date => (
                          <button 
                            key={date}
                            onClick={() => { setSelectedDate(date); setSelectedSession(null); }}
                            className={`px-3.5 py-2 border rounded-md text-xs font-medium transition ${selectedDate === date ? 'border-[#8B5A2B] bg-[#F9F7F2] text-[#8B5A2B]' : 'border-stone-200'}`}
                          >
                            {formatDate(date).split(',')[0]}, {formatDate(date).split(' ')[1]} {formatDate(date).split(' ')[2]?.replace(',','')}
                          </button>
                        ))}
                      </div>
                    </div>

                    {selectedDate && (
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">2. Choose Time Slot</label>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                          {availableSessions.map(session => {
                            const remaining = Math.max(0, session.capacity - (session.booked || 0));
                            const isFull = remaining <= 0;
                            const isSelected = selectedSession?.id === session.id;

                            return (
                              <button 
                                key={session.id}
                                disabled={isFull}
                                onClick={() => handleSelectSession(session)}
                                className={`p-3 border rounded-lg flex flex-col items-center justify-center transition
                                  ${isFull ? 'bg-stone-50 border-stone-200 opacity-40 cursor-not-allowed' : 
                                    isSelected ? 'border-[#8B5A2B] bg-[#F9F7F2] text-[#8B5A2B]' : 'border-stone-200 hover:border-stone-300'}
                                `}
                              >
                                <span className="font-semibold text-sm">{session.startTime}</span>
                                <span className={`text-[10px] mt-1 font-medium ${isFull ? 'text-red-500' : remaining <= 2 ? 'text-amber-600' : 'text-green-600'}`}>
                                  {isFull ? 'FULL' : `${remaining} spot left`}
                                </span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {selectedSession && (
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">3. Number of Participants</label>
                        <select 
                          value={participants} 
                          onChange={(e) => setParticipants(parseInt(e.target.value))}
                          className="w-full md:w-1/2 p-2.5 border border-stone-300 rounded-md text-sm bg-white"
                        >
                          {[...Array(Math.min(10, maxAvailable)).keys()].map(n => (
                            <option key={n+1} value={n+1}>{n+1} {n+1 === 1 ? 'Participant' : 'Participants'} ({formatCurrency((n+1) * product.price)})</option>
                          ))}
                        </select>
                        {maxAvailable <= 3 && (
                          <p className="text-[11px] text-amber-700 mt-1 font-medium">Sesi ini hanya menyisakan {maxAvailable} tempat.</p>
                        )}
                      </div>
                    )}

                    <button 
                      disabled={!selectedSession}
                      onClick={handleContinueToDetails}
                      className={`w-full py-3.5 rounded-md font-medium text-xs tracking-wider transition mt-4 ${selectedSession ? `${theme.primary} text-white` : 'bg-stone-200 text-stone-400 cursor-not-allowed'}`}
                    >
                      CONTINUE TO DETAILS
                    </button>
                  </div>
                )}

                {step === 2 && (
                  <div className="space-y-4">
                    <div className="bg-[#F9F7F2] p-4 rounded-lg border border-[#E8E1D5] flex justify-between items-center text-xs">
                      <div>
                        <p className="font-semibold text-stone-800">{formatDate(selectedSession.date)}</p>
                        <p className="text-stone-500">{selectedSession.startTime} WIB • {participants} Participants</p>
                      </div>
                      <button onClick={() => setStep(1)} className="text-[#8B5A2B] underline">Change</button>
                    </div>

                    <div>
                      <label className="block text-xs font-medium mb-1">Full Name *</label>
                      <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" placeholder="e.g. Budi Santoso" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1">WhatsApp Number *</label>
                      <input type="tel" required value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" placeholder="e.g. 08123456789" />
                    </div>

                    <div className="border-t border-stone-200 pt-4 mt-4">
                      <div className="flex justify-between font-semibold text-base text-stone-900">
                        <span>Total Payment</span>
                        <span className="text-[#8B5A2B]">{formatCurrency(participants * product.price)}</span>
                      </div>
                    </div>

                    <button onClick={handleCreateHoldAndPay} className={`w-full py-3.5 rounded-md font-medium text-xs text-white ${theme.primary}`}>
                      PROCEED TO PAYMENT ({formatCurrency(participants * product.price)})
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // --- MOCK PAYMENT ---
      const MockPaymentCheckout = () => {
        if (!activeBooking) return navigate('home');

        const handleConfirmPayment = () => {
          navigate('confirmation', { ...activeBooking, bookingStatus: 'CONFIRMED', paymentStatus: 'PAID' });
        };

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="flex-grow flex items-center justify-center p-4 py-8">
              <div className="bg-white p-6 rounded-xl max-w-md w-full border border-stone-200 shadow-lg space-y-4">
                <div className="border-b pb-3">
                  <span className="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">MOCK PAYMENT GATEWAY</span>
                  <h3 className="font-semibold text-stone-800 text-base mt-1">Mayar Checkout Preview</h3>
                </div>

                <div className="bg-stone-50 p-4 rounded-lg border text-xs space-y-2">
                  <div className="flex justify-between"><span className="text-stone-500">Booking ID:</span><span className="font-mono font-medium">{activeBooking.displayId}</span></div>
                  <div className="flex justify-between"><span className="text-stone-500">Customer:</span><span className="font-medium">{activeBooking.customerName}</span></div>
                  <div className="flex justify-between font-semibold text-sm pt-2 border-t"><span>Total Amount:</span><span className="text-[#8B5A2B]">{formatCurrency(activeBooking.total)}</span></div>
                </div>

                <button onClick={handleConfirmPayment} className="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-md font-medium text-xs flex items-center justify-center gap-2">
                  <IconCreditCard size={14}/> SIMULATE SUCCESSFUL PAYMENT
                </button>
              </div>
            </div>
          </div>
        );
      };

      // --- CONFIRMATION ---
      const ConfirmationView = () => (
        <div className={`min-h-screen flex flex-col ${theme.bg}`}>
          <Navbar />
          <div className="flex-grow flex items-center justify-center p-4 py-12">
            <div className="bg-white p-8 rounded-xl text-center max-w-md w-full shadow-lg border relative">
              <div className="w-14 h-14 bg-green-100 text-green-700 rounded-full flex items-center justify-center mx-auto mb-4"><IconCheckCircle size={30}/></div>
              <h2 className="text-xl font-medium mb-1">Booking Confirmed!</h2>
              <p className="text-xs text-stone-500 mb-6">Kami menunggu kedatangan Anda di RuangQu Makerspace.</p>
              <button onClick={() => navigate('home')} className={`${theme.primary} text-white py-2.5 px-6 rounded-md text-xs`}>
                Back to Homepage
              </button>
            </div>
          </div>
        </div>
      );

      // --- ADMIN LOGIN ---
      const AdminLoginView = () => {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');

        const handleLogin = (e) => {
          e.preventDefault();
          if (email === 'admin@ruangqu.com' && password === 'admin123') {
            setAdminProfile({ email: 'admin@ruangqu.com', role: 'admin' });
            navigate('admin');
          } else {
            alert('Email/Password salah! Gunakan: admin@ruangqu.com / admin123');
          }
        };

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="flex-grow flex items-center justify-center p-4">
              <div className="bg-white p-8 rounded-xl max-w-sm w-full border shadow-md space-y-4">
                <h2 className="text-lg font-medium text-center">Admin Login</h2>
                <form onSubmit={handleLogin} className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 font-medium">Email</label>
                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="admin@ruangqu.com" className="w-full p-2.5 border rounded-md" />
                  </div>
                  <div>
                    <label className="block mb-1 font-medium">Password</label>
                    <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="admin123" className="w-full p-2.5 border rounded-md" />
                  </div>
                  <button type="submit" className={`w-full py-2.5 text-white rounded-md font-medium ${theme.primary}`}>LOGIN</button>
                </form>
              </div>
            </div>
          </div>
        );
      };

      // --- ROUTER ---
      const views = {
        home: <HomeView />,
        individual: <IndividualBookingFlow />,
        group: <HomeView />,
        onsite: <HomeView />,
        mock_payment: <MockPaymentCheckout />,
        confirmation: <ConfirmationView />,
        lookup: <HomeView />,
        admin_login: <AdminLoginView />,
        admin: <HomeView />
      };

      return views[currentView] || <HomeView />;
    }

    // SAFE RENDER
    const rootElement = document.getElementById('root');
    if (rootElement) {
      ReactDOM.createRoot(rootElement).render(<App />);
    }
  </script>
</body>
</html>
