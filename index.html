<head>
  <meta charset="UTF-8" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<body class="bg-[#F9F7F2] text-[#2D2A26] font-sans antialiased selection:bg-[#8B5A2B] selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- PEMETAAN GAMBAR ---
    const APP_IMAGES = {
      HERO_IMAGE: './Hero image.png',
      INDIVIDUAL_CLASS_IMAGE: './individual class.png',
      GROUP_CLASS_IMAGE: './group class.png',
      ON_SITE_IMAGE: './We Come To You  On-Site.png',
      PROCESS_IMAGE_01: './choose.jpeg',
      PROCESS_IMAGE_02: './hand plane.jpeg',
      PROCESS_IMAGE_03: './smooth.jpg',
      FINISHED_CHOPSTICKS_IMAGE: './oil.jpeg',
      LOGO: './logo RuangQu.png'
    };

    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDemoPlaceholderKeyForRuangQu12345",
      authDomain: "chopstick-makerspace.firebaseapp.com",
      projectId: "chopstick-makerspace",
      storageBucket: "chopstick-makerspace.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- UTILS ---
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);
    };

    const formatDate = (dateString) => {
      if (!dateString) return '';
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('id-ID', options);
    };

    const generateBookingId = () => 'CHP-' + Math.floor(10000 + Math.random() * 90000);
    const HOLD_DURATION_MS = 15 * 60 * 1000;

    const theme = {
      bg: 'bg-[#F9F7F2]',
      text: 'text-[#2D2A26]',
      textMuted: 'text-[#5C5A56]',
      primary: 'bg-[#8B5A2B]',
      primaryHover: 'hover:bg-[#704822]',
      secondary: 'bg-[#E8E1D5]',
      border: 'border-[#E8E1D5]',
      card: 'bg-white',
    };

    // --- GENERATOR JADWAL BULANAN DENGAN POLA MINGGUAN ---
    const generateMonthlySchedule = () => {
      const schedule = [];
      const daysInSeptember2026 = 30;

      const dailySessionTemplates = [
        { idSuffix: 's1', time: '10:00 - 11:00', type: 'INDIVIDUAL', name: 'Sesi 1 (Individual)', capacity: 10 },
        { idSuffix: 's2', time: '11:30 - 12:30', type: 'GROUP', name: 'Sesi 2 (Group Class)', capacity: 20 },
        { idSuffix: 's3', time: '13:00 - 14:00', type: 'INDIVIDUAL', name: 'Sesi 3 (Individual)', capacity: 10 },
        { idSuffix: 's4', time: '14:30 - 15:30', type: 'GROUP', name: 'Sesi 4 (Group Class)', capacity: 20 },
        { idSuffix: 's5', time: '16:00 - 17:00', type: 'INDIVIDUAL', name: 'Sesi 5 (Individual)', capacity: 10 }
      ];

      for (let day = 1; day <= daysInSeptember2026; day++) {
        const dateStr = `2026-09-${day < 10 ? '0' + day : day}`;
        const dateObj = new Date(dateStr);
        const dayOfWeek = dateObj.getDay();

        let isAvailableDay = false;

        if (day >= 1 && day <= 7) {
          if (dayOfWeek === 1 || dayOfWeek === 3 || dayOfWeek === 6) isAvailableDay = true;
        } else if (day >= 8 && day <= 14) {
          if (dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 0) isAvailableDay = true;
        } else if (day >= 15 && day <= 21) {
          if (dayOfWeek === 2 || dayOfWeek === 5 || dayOfWeek === 6) isAvailableDay = true;
        } else if (day >= 22) {
          if (dayOfWeek === 1 || dayOfWeek === 4 || dayOfWeek === 0) isAvailableDay = true;
        }

        if (isAvailableDay) {
          dailySessionTemplates.forEach((template) => {
            schedule.push({
              id: `${dateStr}-${template.idSuffix}`,
              date: dateStr,
              startTime: template.time.split(' - ')[0],
              endTime: template.time.split(' - ')[1],
              sessionType: template.type,
              sessionName: template.name,
              capacity: template.capacity,
              booked: Math.floor(Math.random() * 2),
              status: 'OPEN'
            });
          });
        }
      }

      return schedule;
    };

    // --- COMPONENT FOTO ---
    const PlaceholderImage = ({ label, className = "", style = {} }) => {
      const [imgError, setImgError] = useState(false);
      const imgSrc = APP_IMAGES[label];

      if (imgSrc && !imgError) {
        return (
          <img 
            src={imgSrc} 
            alt={label} 
            onError={() => setImgError(true)}
            className={`object-cover ${className}`} 
            style={style} 
          />
        );
      }

      return (
        <div className={`flex items-center justify-center bg-[#E8E1D5] text-[#8B5A2B] font-mono text-xs text-center p-4 border border-[#D8C1B5] border-dashed select-none ${className}`} style={style}>
          {label}
        </div>
      );
    };

    // --- SVG ICONS ---
    const IconClock = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconArrowRight = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
    const IconCheckCircle = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconChevronRight = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>;
    const IconMenu = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
    const IconX = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconLock = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const IconCreditCard = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>;
    const IconAlertCircle = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const IconDashboard = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>;
    const IconLogOut = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    const IconCalendar = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const IconUsers = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const IconSliders = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>;
    const IconPlus = ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;

    // --- MAIN APP COMPONENT ---
    function App() {
      const [authUser, setAuthUser] = useState(null);
      const [adminProfile, setAdminProfile] = useState(null);
      const [currentView, setCurrentView] = useState('home');
      const [selectedType, setSelectedType] = useState('INDIVIDUAL');
      const [activeBooking, setActiveBooking] = useState(null);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const [products, setProducts] = useState({
        individual: { id: 'individual', price: 175000, name: 'Individual Class' },
        group: { id: 'group', price: 150000, name: 'Group Class' },
        onsite: { id: 'onsite', price: 200000, name: 'We Come To You' }
      });

      const [allSessions, setAllSessions] = useState([]);
      
      const [bookings, setBookings] = useState([
        {
          id: 'b_101',
          bookingId: 'CHP-12840',
          displayId: 'CHP-12840',
          customerName: 'Budi Santoso',
          whatsapp: '081234567890',
          email: 'budi@gmail.com',
          bookingType: 'INDIVIDUAL',
          date: '2026-09-12',
          time: '10:00',
          participants: 2,
          pricePerPerson: 175000,
          total: 350000,
          bookingStatus: 'CONFIRMED',
          paymentStatus: 'PAID',
          createdAt: Date.now() - 3600000
        },
        {
          id: 'b_102',
          bookingId: 'CHP-49210',
          displayId: 'CHP-49210',
          customerName: 'Siti Rahma',
          whatsapp: '085712345678',
          email: 'siti@gmail.com',
          bookingType: 'GROUP',
          date: '2026-09-12',
          time: '11:30',
          participants: 12,
          pricePerPerson: 150000,
          total: 1800000,
          bookingStatus: 'PENDING_PAYMENT',
          paymentStatus: 'PENDING',
          createdAt: Date.now() - 1800000
        }
      ]);

      const [requests, setRequests] = useState([
        {
          id: 'req_201',
          groupName: 'PT Ruang Kreatif',
          customerName: 'Maya Indah',
          whatsapp: '08119876543',
          participants: 15,
          eventDate: '2026-09-20',
          eventTime: '14:00',
          location: 'Gedung Wisma 46, Jakarta Pusat',
          subtotal: 3000000,
          transportFee: 250000,
          total: 3250000,
          bookingStatus: 'REQUESTED'
        }
      ]);

      useEffect(() => {
        auth.signInAnonymously().catch(() => {});
        const unsub = auth.onAuthStateChanged((user) => {
          setAuthUser(user);
        });

        setAllSessions(generateMonthlySchedule());
        return () => unsub();
      }, []);

      const navigate = (view, type = 'INDIVIDUAL', data = null) => {
        if (view === 'admin' && !adminProfile) {
          setCurrentView('admin_login');
          return;
        }
        setSelectedType(type);
        setCurrentView(view);
        if (data) setActiveBooking(data);
        window.scrollTo(0, 0);
        setIsMobileMenuOpen(false);
      };

      // --- NAVBAR ---
      const Navbar = () => (
        <nav className={`sticky top-0 z-50 bg-white ${theme.border} border-b px-4 md:px-8 py-3 flex justify-between items-center shadow-sm`}>
          <div className="flex items-center gap-3 cursor-pointer" onClick={() => navigate('home')}>
            <img src={APP_IMAGES.LOGO} alt="Logo RuangQu" className="h-8 md:h-10 object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
            <div>
              <span className="font-semibold tracking-wider text-sm md:text-base block leading-none text-[#2D2A26]">CHOPSTICK MAKING</span>
              <span className="text-[10px] text-[#8B5A2B] tracking-widest uppercase">by RuangQu</span>
            </div>
          </div>
          
          <div className="hidden md:flex gap-7 text-xs font-medium tracking-wider">
            <button onClick={() => navigate('home')} className={`${theme.textMuted} hover:${theme.text} transition`}>EXPERIENCES</button>
            <button onClick={() => navigate('lookup')} className={`${theme.textMuted} hover:${theme.text} transition`}>MANAGE BOOKING</button>
            {adminProfile ? (
              <button onClick={() => navigate('admin')} className="text-[#8B5A2B] font-semibold flex items-center gap-1.5 bg-[#E8E1D5] px-3 py-1.5 rounded-full">
                <IconDashboard size={13}/> ADMIN DASHBOARD
              </button>
            ) : (
              <button onClick={() => navigate('admin_login')} className={`${theme.textMuted} hover:${theme.text} transition flex items-center gap-1`}>
                <IconLock size={12}/> ADMIN LOGIN
              </button>
            )}
          </div>

          <div className="md:hidden flex items-center">
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-1">
              {isMobileMenuOpen ? <IconX size={22} /> : <IconMenu size={22} />}
            </button>
          </div>

          {isMobileMenuOpen && (
            <div className="absolute top-[58px] left-0 w-full bg-white border-b flex flex-col p-5 shadow-xl md:hidden z-50">
              <button onClick={() => navigate('home')} className="py-3 text-left border-b border-stone-200 text-sm font-medium">Experiences</button>
              <button onClick={() => navigate('lookup')} className="py-3 text-left border-b border-stone-200 text-sm font-medium">Manage Your Booking</button>
              {adminProfile ? (
                <button onClick={() => navigate('admin')} className="py-3 text-left text-[#8B5A2B] font-semibold text-sm flex items-center gap-2">
                  <IconDashboard size={16}/> Admin Dashboard
                </button>
              ) : (
                <button onClick={() => navigate('admin_login')} className="py-3 text-left text-sm flex items-center gap-2 text-stone-600">
                  <IconLock size={16}/> Admin Login
                </button>
              )}
            </div>
          )}
        </nav>
      );

      // --- FOOTER ---
      const Footer = () => (
        <footer className={`${theme.primary} text-white py-12 px-6 text-center mt-auto`}>
          <div className="max-w-4xl mx-auto flex flex-col items-center gap-4">
            <img src={APP_IMAGES.LOGO} alt="Logo RuangQu" className="h-10 object-contain brightness-0 invert opacity-90" onError={(e) => { e.target.style.display = 'none'; }} />
            <p className="text-white/80 max-w-md text-xs md:text-sm leading-relaxed">
              A hands-on woodworking experience where you shape, smooth and personalize your own pair of wooden chopsticks.
            </p>
            <div className="text-white/50 text-[11px] mt-2 border-t border-white/10 pt-4 w-full">
              &copy; {new Date().getFullYear()} RuangQu Makerspace. All rights reserved. • Approx. 45–60 mins per session
            </div>
          </div>
        </footer>
      );

      // --- HOME VIEW ---
      const HomeView = () => (
        <div className="flex flex-col min-h-screen">
          <Navbar />
          
          <section className="relative pt-10 pb-16 md:py-20 px-4 md:px-8 max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-10 md:gap-12">
            <div className="flex-1 space-y-5 text-center md:text-left">
              <div className="inline-flex items-center gap-2 px-3 py-1 bg-[#E8E1D5] text-[#8B5A2B] text-[11px] font-semibold tracking-widest rounded-full border border-[#D8C1B5]">
                <span>RUANGQU MAKERSPACE</span> • <span>JAKARTA</span>
              </div>
              <h1 className="text-4xl md:text-6xl font-light tracking-tight text-[#2D2A26] leading-tight">
                Make your own <br/><span className="font-serif italic font-normal">chopsticks.</span>
              </h1>
              <p className="text-sm md:text-base text-[#5C5A56] max-w-md mx-auto md:mx-0 leading-relaxed">
                Shape it. Smooth it. Make it yours. A hands-on woodworking experience taking approximately 45–60 minutes.
              </p>
              <div className="flex flex-col sm:flex-row gap-3.5 pt-2 justify-center md:justify-start">
                <button onClick={() => document.getElementById('experiences').scrollIntoView({ behavior: 'smooth' })} className={`${theme.primary} ${theme.primaryHover} text-white px-7 py-3.5 rounded-md font-medium text-xs tracking-wider transition flex items-center justify-center gap-2 shadow-md`}>
                  BOOK YOUR EXPERIENCE <IconArrowRight size={16} />
                </button>
                <button onClick={() => document.getElementById('how-it-works').scrollIntoView({ behavior: 'smooth' })} className="bg-white border border-[#2D2A26] text-[#2D2A26] hover:bg-stone-100 px-6 py-3.5 rounded-md font-medium text-xs tracking-wider transition">
                  HOW IT WORKS
                </button>
              </div>
            </div>
            <div className="flex-1 w-full relative max-w-lg md:max-w-none">
              <PlaceholderImage label="HERO_IMAGE" className="w-full aspect-[4/3] rounded-lg shadow-xl" />
              <div className="absolute -bottom-4 -left-4 md:-bottom-6 md:-left-6 bg-white p-3.5 md:p-4 rounded-lg shadow-lg flex items-center gap-3 border border-[#E8E1D5]">
                <div className="bg-[#E8E1D5] text-[#8B5A2B] p-2 rounded-full"><IconClock size={18}/></div>
                <div>
                  <p className="text-[10px] text-stone-500 uppercase tracking-wider">Duration</p>
                  <p className="font-semibold text-xs md:text-sm">45–60 Minutes</p>
                </div>
              </div>
            </div>
          </section>

          <section id="experiences" className="py-16 md:py-20 px-4 bg-white border-y border-[#E8E1D5]">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-2xl md:text-3xl font-medium tracking-tight mb-2">Choose Your Experience</h2>
                <p className="text-xs md:text-sm text-[#5C5A56] max-w-md mx-auto">Select a public workshop, reserve a private group session, or have us come to your venue.</p>
              </div>

              <div className="grid md:grid-cols-3 gap-6 md:gap-8">
                {/* Individual */}
                <div className="bg-[#F9F7F2] rounded-xl overflow-hidden border border-[#E8E1D5] flex flex-col hover:shadow-md transition">
                  <PlaceholderImage label="INDIVIDUAL_CLASS_IMAGE" className="h-48 w-full" />
                  <div className="p-6 flex flex-col flex-grow">
                    <div className="flex justify-between items-start mb-2">
                      <h3 className="text-lg font-medium">Individual Class</h3>
                      <span className="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-medium">Popular</span>
                    </div>
                    <p className="text-xs text-[#5C5A56] mb-5 flex-grow leading-relaxed">
                      Join a public workshop at RuangQu. Perfect for solo makers, couples, or pairs. 
                    </p>
                    <div className="border-t border-[#E8E1D5] pt-4 mb-5">
                      <p className="font-semibold text-lg">{formatCurrency(products.individual?.price)} <span className="text-xs font-normal text-[#5C5A56]">/ person</span></p>
                      <p className="text-[11px] text-[#5C5A56] mt-0.5">1–10 spots per session • 45–60 mins</p>
                    </div>
                    <button onClick={() => navigate('booking', 'INDIVIDUAL')} className={`w-full ${theme.primary} ${theme.primaryHover} text-white py-3 rounded-md font-medium text-xs tracking-wider transition`}>
                      BOOK INDIVIDUAL
                    </button>
                  </div>
                </div>

                {/* Group */}
                <div className="bg-[#F9F7F2] rounded-xl overflow-hidden border border-[#E8E1D5] flex flex-col hover:shadow-md transition">
                  <PlaceholderImage label="GROUP_CLASS_IMAGE" className="h-48 w-full" />
                  <div className="p-6 flex flex-col flex-grow">
                    <h3 className="text-lg font-medium mb-2">Group Class</h3>
                    <p className="text-xs text-[#5C5A56] mb-5 flex-grow leading-relaxed">
                      Private studio experience for birthdays, family gatherings, team building, or community events.
                    </p>
                    <div className="border-t border-[#E8E1D5] pt-4 mb-5">
                      <p className="font-semibold text-lg">{formatCurrency(products.group?.price)} <span className="text-xs font-normal text-[#5C5A56]">/ person</span></p>
                      <p className="text-[11px] text-[#5C5A56] mt-0.5">Min. 10 pax, max 20 pax</p>
                    </div>
                    <button onClick={() => navigate('booking', 'GROUP')} className={`w-full bg-[#2D2A26] hover:bg-stone-900 text-white py-3 rounded-md font-medium text-xs tracking-wider transition`}>
                      BOOK PRIVATE GROUP
                    </button>
                  </div>
                </div>

                {/* On-Site */}
                <div className="bg-[#F9F7F2] rounded-xl overflow-hidden border border-[#E8E1D5] flex flex-col hover:shadow-md transition">
                  <PlaceholderImage label="ON_SITE_IMAGE" className="h-48 w-full" />
                  <div className="p-6 flex flex-col flex-grow">
                    <h3 className="text-lg font-medium mb-2">We Come To You</h3>
                    <p className="text-xs text-[#5C5A56] mb-5 flex-grow leading-relaxed">
                      We bring our mobile woodworking tools & materials to your office, school, or venue in Jabodetabek.
                    </p>
                    <div className="border-t border-[#E8E1D5] pt-4 mb-5">
                      <p className="font-semibold text-lg">{formatCurrency(products.onsite?.price)} <span className="text-xs font-normal text-[#5C5A56]">/ person</span></p>
                      <p className="text-[11px] text-[#5C5A56] mt-0.5">Min. 10 pax + Custom transport fee</p>
                    </div>
                    <button onClick={() => navigate('onsite')} className={`w-full bg-white border border-[#2D2A26] text-[#2D2A26] hover:bg-stone-50 py-3 rounded-md font-medium text-xs tracking-wider transition`}>
                      REQUEST ON-SITE EVENT
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="how-it-works" className="py-16 md:py-20 px-4">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-2xl md:text-3xl font-medium tracking-tight mb-2">How It Works</h2>
                <p className="text-xs md:text-sm text-[#5C5A56]">Four simple steps to your custom handcrafted chopsticks.</p>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                {[
                  { label: 'PROCESS_IMAGE_01', num: '01', title: 'Choose Wood', desc: 'Select your preferred hardwood blank.' },
                  { label: 'PROCESS_IMAGE_02', num: '02', title: 'Hand Plane', desc: 'Shape the taper using traditional hand planes.' },
                  { label: 'PROCESS_IMAGE_03', num: '03', title: 'Smooth & Sand', desc: 'Progressively sand to an ultra-smooth finish.' },
                  { label: 'FINISHED_CHOPSTICKS_IMAGE', num: '04', title: 'Oil & Take Home', desc: 'Apply natural food-safe beeswax oil & use!' }
                ].map((st, i) => (
                  <div key={i} className="bg-white p-4 rounded-xl border border-[#E8E1D5] text-center flex flex-col items-center">
                    <PlaceholderImage label={st.label} className="w-full aspect-square rounded-lg mb-3" />
                    <span className="text-lg font-serif text-[#8B5A2B] font-bold block mb-1">{st.num}</span>
                    <h4 className="font-medium text-xs md:text-sm mb-1">{st.title}</h4>
                    <p className="text-[11px] text-[#5C5A56]">{st.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <Footer />
        </div>
      );

      // --- BOOKING FLOW ---
      const BookingFlow = () => {
        const [step, setStep] = useState(1);
        const [selectedDate, setSelectedDate] = useState('');
        const [selectedSession, setSelectedSession] = useState(null);
        const [participants, setParticipants] = useState(selectedType === 'GROUP' ? 10 : 1);
        const [maxAvailable, setMaxAvailable] = useState(selectedType === 'GROUP' ? 20 : 10);
        const [formData, setFormData] = useState({ name: '', whatsapp: '', email: '' });
        const [errorMsg, setErrorMsg] = useState('');

        const isGroup = selectedType === 'GROUP';
        const product = isGroup ? products.group : products.individual;

        const filteredSessions = useMemo(() => {
          return allSessions.filter(s => s.sessionType === selectedType);
        }, [selectedType]);

        const uniqueDates = useMemo(() => {
          return [...new Set(filteredSessions.map(s => s.date))].sort();
        }, [filteredSessions]);

        const availableSessionsForDate = useMemo(() => {
          return filteredSessions.filter(s => s.date === selectedDate);
        }, [filteredSessions, selectedDate]);

        const handleSelectSession = (session) => {
          setSelectedSession(session);
          const avail = Math.max(0, session.capacity - (session.booked || 0));
          setMaxAvailable(avail);
          if (participants > avail) {
            setParticipants(avail > 0 ? avail : (isGroup ? 10 : 1));
          }
        };

        const handleContinueToDetails = () => {
          if (!selectedSession) return;
          if (participants > maxAvailable) {
            setErrorMsg(`Hanya tersisa ${maxAvailable} tempat untuk sesi ini.`);
            return;
          }
          if (isGroup && participants < 10) {
            setErrorMsg('Minimal peserta untuk Group Class adalah 10 orang.');
            return;
          }
          setErrorMsg('');
          setStep(2);
        };

        const handleCreateHoldAndPay = async () => {
          if (!formData.name || !formData.whatsapp) {
            setErrorMsg("Nama dan Nomor WhatsApp wajib diisi.");
            return;
          }

          const bookingId = generateBookingId();
          const total = participants * product.price;

          const bookingRecord = {
            id: 'b_' + Date.now(),
            bookingId,
            displayId: bookingId,
            customerName: formData.name,
            whatsapp: formData.whatsapp,
            email: formData.email,
            bookingType: selectedType,
            sessionId: selectedSession.id,
            sessionName: selectedSession.sessionName,
            date: selectedSession.date,
            time: selectedSession.startTime,
            participants,
            pricePerPerson: product.price,
            total,
            bookingStatus: 'PENDING_PAYMENT',
            paymentStatus: 'PENDING',
            paymentExpiresAt: Date.now() + HOLD_DURATION_MS
          };

          setBookings(prev => [bookingRecord, ...prev]);
          navigate('mock_payment', selectedType, bookingRecord);
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#F9F7F2]">
            <Navbar />
            <div className="max-w-3xl mx-auto w-full px-4 py-8 flex-grow">
              <button onClick={() => step > 1 ? setStep(step-1) : navigate('home')} className="flex items-center gap-1.5 text-xs font-medium mb-6 hover:opacity-75 transition">
                <IconChevronRight className="rotate-180" size={14}/> Back
              </button>
              
              <div className="bg-white p-6 md:p-10 rounded-xl shadow-sm border border-[#E8E1D5]">
                <div className="flex justify-between items-center mb-1">
                  <h2 className="text-2xl font-medium">{isGroup ? 'Book Private Group Class' : 'Book Individual Class'}</h2>
                  <span className="text-xs bg-[#E8E1D5] text-[#8B5A2B] px-2.5 py-1 rounded font-medium">{selectedType}</span>
                </div>
                <p className="text-xs text-[#5C5A56] mb-6">
                  {formatCurrency(product.price)} / person • {isGroup ? 'Min 10 - Maks 20 orang per sesi' : 'Maks 10 orang per sesi'}
                </p>

                {errorMsg && (
                  <div className="bg-red-50 text-red-700 p-3 rounded-md text-xs mb-6 border border-red-200 flex items-center gap-2">
                    <IconAlertCircle size={16}/> <span>{errorMsg}</span>
                  </div>
                )}

                {step === 1 && (
                  <div className="space-y-6">
                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">1. Pilih Tanggal (September 2026)</label>
                      <div className="flex flex-wrap gap-2.5">
                        {uniqueDates.map(date => (
                          <button 
                            key={date}
                            onClick={() => { setSelectedDate(date); setSelectedSession(null); }}
                            className={`px-3.5 py-2 border rounded-md text-xs font-medium transition ${selectedDate === date ? 'border-[#8B5A2B] bg-[#F9F7F2] text-[#8B5A2B]' : 'border-stone-200 bg-white'}`}
                          >
                            {formatDate(date)}
                          </button>
                        ))}
                      </div>
                    </div>

                    {selectedDate && (
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">2. Pilih Sesi Jam</label>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                          {availableSessionsForDate.map(session => {
                            const remaining = Math.max(0, session.capacity - (session.booked || 0));
                            const isFull = remaining <= 0 || (isGroup && remaining < 10);
                            const isSelected = selectedSession?.id === session.id;

                            return (
                              <button 
                                key={session.id}
                                disabled={isFull}
                                onClick={() => handleSelectSession(session)}
                                className={`p-3.5 border rounded-lg flex justify-between items-center transition
                                  ${isFull ? 'bg-stone-50 border-stone-200 opacity-40 cursor-not-allowed' : 
                                    isSelected ? 'border-[#8B5A2B] bg-[#F9F7F2] text-[#8B5A2B]' : 'border-stone-200 bg-white hover:border-stone-300'}
                                `}
                              >
                                <div className="text-left">
                                  <span className="font-semibold text-xs block">{session.sessionName}</span>
                                  <span className="text-[11px] text-stone-500">{session.startTime} - {session.endTime} WIB</span>
                                </div>
                                <span className={`text-[10px] font-semibold px-2 py-1 rounded ${isFull ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                  {isFull ? 'PENUH' : `${remaining} Sisa Slot`}
                                </span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {selectedSession && (
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">3. Jumlah Peserta</label>
                        {isGroup ? (
                          <input 
                            type="number" 
                            min="10" 
                            max={Math.min(20, maxAvailable)} 
                            value={participants} 
                            onChange={(e) => setParticipants(parseInt(e.target.value) || 10)} 
                            className="w-full md:w-1/2 p-2.5 border border-stone-300 rounded-md text-sm bg-white"
                          />
                        ) : (
                          <select 
                            value={participants} 
                            onChange={(e) => setParticipants(parseInt(e.target.value))}
                            className="w-full md:w-1/2 p-2.5 border border-stone-300 rounded-md text-sm bg-white"
                          >
                            {[...Array(Math.min(10, maxAvailable)).keys()].map(n => (
                              <option key={n+1} value={n+1}>{n+1} Peserta ({formatCurrency((n+1) * product.price)})</option>
                            ))}
                          </select>
                        )}
                      </div>
                    )}

                    <button 
                      disabled={!selectedSession}
                      onClick={handleContinueToDetails}
                      className={`w-full py-3.5 rounded-md font-medium text-xs tracking-wider transition mt-4 ${selectedSession ? `${theme.primary} text-white shadow-md` : 'bg-stone-200 text-stone-400 cursor-not-allowed'}`}
                    >
                      LANJUTKAN KE DETAIL
                    </button>
                  </div>
                )}

                {step === 2 && (
                  <div className="space-y-4">
                    <div className="bg-[#F9F7F2] p-4 rounded-lg border border-[#E8E1D5] flex justify-between items-center text-xs">
                      <div>
                        <p className="font-semibold text-stone-800">{formatDate(selectedSession.date)}</p>
                        <p className="text-stone-500">{selectedSession.sessionName} ({selectedSession.startTime} WIB) • {participants} Peserta</p>
                      </div>
                      <button onClick={() => setStep(1)} className="text-[#8B5A2B] underline">Ubah</button>
                    </div>

                    <div>
                      <label className="block text-xs font-medium mb-1">Nama Pemesan / Group *</label>
                      <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" placeholder="e.g. Budi Santoso / Komunitas Kayu" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1">Nomor WhatsApp *</label>
                      <input type="tel" required value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" placeholder="e.g. 08123456789" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1">Email</label>
                      <input type="email" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" placeholder="nama@email.com" />
                    </div>

                    <div className="border-t border-stone-200 pt-4 mt-4">
                      <div className="flex justify-between font-semibold text-base text-stone-900">
                        <span>Total Pembayaran</span>
                        <span className="text-[#8B5A2B]">{formatCurrency(participants * product.price)}</span>
                      </div>
                    </div>

                    <button onClick={handleCreateHoldAndPay} className={`w-full py-3.5 rounded-md font-medium text-xs text-white ${theme.primary} shadow-md`}>
                      LANJUT KE PEMBAYARAN ({formatCurrency(participants * product.price)})
                    </button>
                  </div>
                )}
              </div>
            </div>
            <Footer />
          </div>
        );
      };

      // --- FORM WE COME TO YOU ---
      const OnSiteFlow = () => {
        const [formData, setFormData] = useState({
          groupName: '',
          participants: 10,
          location: '',
          eventDate: '',
          eventTime: '10:00',
          whatsapp: ''
        });
        const [isSubmitted, setIsSubmitted] = useState(false);

        const handleSubmit = (e) => {
          e.preventDefault();
          const newReq = {
            id: 'req_' + Date.now(),
            groupName: formData.groupName,
            customerName: formData.groupName,
            whatsapp: formData.whatsapp,
            participants: formData.participants,
            eventDate: formData.eventDate,
            eventTime: formData.eventTime,
            location: formData.location,
            subtotal: formData.participants * products.onsite.price,
            transportFee: 0,
            total: formData.participants * products.onsite.price,
            bookingStatus: 'REQUESTED'
          };
          setRequests(prev => [newReq, ...prev]);
          setIsSubmitted(true);
        };

        if (isSubmitted) {
          return (
            <div className="min-h-screen flex flex-col bg-[#F9F7F2]">
              <Navbar />
              <div className="flex-grow flex items-center justify-center p-4">
                <div className="bg-white p-8 md:p-10 rounded-xl text-center max-w-md w-full shadow-lg border border-[#E8E1D5]">
                  <div className="w-14 h-14 bg-green-100 text-green-700 rounded-full flex items-center justify-center mx-auto mb-4"><IconCheckCircle size={30}/></div>
                  <h2 className="text-xl font-medium mb-2">Permintaan Diterima!</h2>
                  <p className="text-xs text-[#5C5A56] leading-relaxed mb-6">
                    Terima kasih <strong>{formData.groupName}</strong>! Detail kegiatan on-site Anda pada tanggal <strong>{formatDate(formData.eventDate)}</strong> telah kami terima. Tim RuangQu akan segera menghubungi WhatsApp Anda di <strong>{formData.whatsapp}</strong> untuk mengonfirmasi detail & rincian biaya.
                  </p>
                  <button onClick={() => navigate('home')} className={`${theme.primary} text-white py-2.5 px-6 rounded-md text-xs shadow-md`}>
                    Kembali ke Beranda
                  </button>
                </div>
              </div>
              <Footer />
            </div>
          );
        }

        return (
          <div className="min-h-screen flex flex-col bg-[#F9F7F2]">
            <Navbar />
            <div className="max-w-2xl mx-auto w-full px-4 py-8 flex-grow">
              <button onClick={() => navigate('home')} className="flex items-center gap-1.5 text-xs font-medium mb-6 hover:opacity-75 transition">
                <IconChevronRight className="rotate-180" size={14}/> Back
              </button>

              <div className="bg-white p-6 md:p-10 rounded-xl shadow-sm border border-[#E8E1D5]">
                <h2 className="text-2xl font-medium mb-1">We Come To You (On-Site Workshop)</h2>
                <p className="text-xs text-[#5C5A56] mb-6">Isi formulir di bawah ini. Tim kami akan menghubungi Anda untuk konfirmasi jadwal dan estimasi biaya.</p>

                <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-medium mb-1">1. Nama Group / Perusahaan / Komunitas *</label>
                    <input type="text" required value={formData.groupName} onChange={e => setFormData({...formData, groupName: e.target.value})} placeholder="e.g. PT Ruang Kreatif / Keluarga Budi" className="w-full p-2.5 border rounded-md text-sm" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-medium mb-1">2. Jumlah Peserta (Min 10) *</label>
                      <input type="number" min="10" required value={formData.participants} onChange={e => setFormData({...formData, participants: parseInt(e.target.value) || 10})} className="w-full p-2.5 border rounded-md text-sm" />
                    </div>
                    <div>
                      <label className="block font-medium mb-1">3. Nomor WhatsApp *</label>
                      <input type="tel" required value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value})} placeholder="e.g. 08123456789" className="w-full p-2.5 border rounded-md text-sm" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-medium mb-1">4. Tanggal Kegiatan *</label>
                      <input type="date" required value={formData.eventDate} onChange={e => setFormData({...formData, eventDate: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" />
                    </div>
                    <div>
                      <label className="block font-medium mb-1">5. Jam Kegiatan *</label>
                      <input type="time" required value={formData.eventTime} onChange={e => setFormData({...formData, eventTime: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-medium mb-1">6. Lokasi Kegiatan (Jabodetabek) *</label>
                    <textarea required rows="3" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} placeholder="Alamat lengkap lokasi/gedung kegiatan" className="w-full p-2.5 border rounded-md text-sm"></textarea>
                  </div>

                  <button type="submit" className={`w-full py-3.5 text-white rounded-md font-medium text-xs ${theme.primary} shadow-md transition mt-2`}>
                    KIRIM PERMINTAAN ON-SITE
                  </button>
                </form>
              </div>
            </div>
            <Footer />
          </div>
        );
      };

      // --- MOCK PAYMENT ---
      const MockPaymentCheckout = () => {
        if (!activeBooking) return navigate('home');

        const handleConfirmPayment = () => {
          setBookings(prev => prev.map(b => b.id === activeBooking.id ? { ...b, bookingStatus: 'CONFIRMED', paymentStatus: 'PAID' } : b));
          navigate('confirmation', selectedType, { ...activeBooking, bookingStatus: 'CONFIRMED', paymentStatus: 'PAID' });
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#F9F7F2]">
            <Navbar />
            <div className="flex-grow flex items-center justify-center p-4 py-8">
              <div className="bg-white p-6 rounded-xl max-w-md w-full border border-stone-200 shadow-lg space-y-4">
                <div className="border-b pb-3">
                  <span className="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">MOCK PAYMENT GATEWAY</span>
                  <h3 className="font-semibold text-stone-800 text-base mt-1">Mayar Checkout Preview</h3>
                </div>

                <div className="bg-stone-50 p-4 rounded-lg border text-xs space-y-2">
                  <div className="flex justify-between"><span className="text-stone-500">Booking ID:</span><span className="font-mono font-medium">{activeBooking.displayId}</span></div>
                  <div className="flex justify-between"><span className="text-stone-500">Customer:</span><span className="font-medium">{activeBooking.customerName}</span></div>
                  <div className="flex justify-between font-semibold text-sm pt-2 border-t"><span>Total Amount:</span><span className="text-[#8B5A2B]">{formatCurrency(activeBooking.total)}</span></div>
                </div>

                <button onClick={handleConfirmPayment} className="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-md font-medium text-xs flex items-center justify-center gap-2 shadow-md">
                  <IconCreditCard size={14}/> SIMULATE SUCCESSFUL PAYMENT
                </button>
              </div>
            </div>
            <Footer />
          </div>
        );
      };

      // --- CONFIRMATION ---
      const ConfirmationView = () => (
        <div className="min-h-screen flex flex-col bg-[#F9F7F2]">
          <Navbar />
          <div className="flex-grow flex items-center justify-center p-4 py-12">
            <div className="bg-white p-8 rounded-xl text-center max-w-md w-full shadow-lg border relative">
              <div className="w-14 h-14 bg-green-100 text-green-700 rounded-full flex items-center justify-center mx-auto mb-4"><IconCheckCircle size={30}/></div>
              <h2 className="text-xl font-medium mb-1">Booking Confirmed!</h2>
              <p className="text-xs text-stone-500 mb-6">Kami menunggu kedatangan Anda di RuangQu Makerspace.</p>
              <button onClick={() => navigate('home')} className={`${theme.primary} text-white py-2.5 px-6 rounded-md text-xs shadow-md`}>
                Kembali ke Beranda
              </button>
            </div>
          </div>
          <Footer />
        </div>
      );

      // --- LOOKUP VIEW (Cek Booking Pelanggan) ---
      const LookupView = () => {
        const [searchId, setSearchId] = useState('');
        const [whatsapp, setWhatsapp] = useState('');
        const [foundBooking, setFoundBooking] = useState(null);
        const [error, setError] = useState('');

        const handleSearch = (e) => {
          e.preventDefault();
          setError('');
          setFoundBooking(null);

          const match = bookings.find(b => 
            b.displayId.toUpperCase() === searchId.trim().toUpperCase() && 
            b.whatsapp.trim() === whatsapp.trim()
          );

          if (match) {
            setFoundBooking(match);
          } else {
            setError('Data booking tidak ditemukan. Pastikan Booking ID & Nomor WhatsApp sesuai.');
          }
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#F9F7F2]">
            <Navbar />
            <div className="max-w-md mx-auto w-full px-4 py-12 flex-grow">
              <h2 className="text-2xl font-medium mb-1 text-center">Manage Your Booking</h2>
              <p className="text-xs text-stone-500 text-center mb-6">Masukkan Booking ID & Nomor WhatsApp terdaftar Anda.</p>

              <form onSubmit={handleSearch} className="bg-white p-6 rounded-xl border border-stone-200 shadow-sm space-y-3 mb-6">
                <div>
                  <label className="block text-xs font-medium mb-1">Booking ID</label>
                  <input required type="text" value={searchId} onChange={e => setSearchId(e.target.value)} placeholder="e.g. CHP-12840" className="w-full p-2.5 border rounded-md text-sm font-mono uppercase" />
                </div>
                <div>
                  <label className="block text-xs font-medium mb-1">Nomor WhatsApp</label>
                  <input required type="tel" value={whatsapp} onChange={e => setWhatsapp(e.target.value)} placeholder="e.g. 081234567890" className="w-full p-2.5 border rounded-md text-sm" />
                </div>
                <button type="submit" className={`w-full py-2.5 rounded-md font-medium text-xs text-white ${theme.primary} transition mt-2`}>
                  CARI BOOKING
                </button>
              </form>

              {error && <div className="bg-red-50 text-red-700 text-xs p-3 rounded-md border border-red-200 text-center mb-4">{error}</div>}

              {foundBooking && (
                <div className="bg-white p-6 rounded-xl border border-stone-200 shadow-md space-y-4">
                  <div className="flex justify-between items-start border-b pb-3">
                    <div>
                      <span className="text-[10px] text-stone-400 uppercase">Booking ID</span>
                      <p className="font-mono font-bold text-stone-900">{foundBooking.displayId}</p>
                    </div>
                    <span className={`px-2.5 py-1 text-[10px] font-bold rounded-full uppercase ${foundBooking.bookingStatus === 'CONFIRMED' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                      {foundBooking.bookingStatus}
                    </span>
                  </div>

                  <div className="text-xs space-y-2 text-stone-700">
                    <div className="flex justify-between"><span className="text-stone-400">Pemesan:</span><span>{foundBooking.customerName}</span></div>
                    <div className="flex justify-between"><span className="text-stone-400">Kelas:</span><span>{foundBooking.bookingType}</span></div>
                    <div className="flex justify-between"><span className="text-stone-400">Jadwal:</span><span>{formatDate(foundBooking.date)} ({foundBooking.time} WIB)</span></div>
                    <div className="flex justify-between"><span className="text-stone-400">Peserta:</span><span>{foundBooking.participants} Orang</span></div>
                    <div className="flex justify-between font-semibold pt-2 border-t"><span>Total:</span><span className="text-[#8B5A2B]">{formatCurrency(foundBooking.total)}</span></div>
                  </div>

                  {foundBooking.bookingStatus === 'PENDING_PAYMENT' && (
                    <button onClick={() => navigate('mock_payment', foundBooking.bookingType, foundBooking)} className="w-full bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-md text-xs font-medium">
                      BAYAR SEKARANG
                    </button>
                  )}
                </div>
              )}
            </div>
            <Footer />
          </div>
        );
      };

      // --- ADMIN LOGIN VIEW ---
      const AdminLoginView = () => {
        const [email, setEmail] = useState('admin@ruangqu.com');
        const [password, setPassword] = useState('admin123');

        const handleLogin = (e) => {
          e.preventDefault();
          if (email === 'admin@ruangqu.com' && password === 'admin123') {
            setAdminProfile({ email: 'admin@ruangqu.com', role: 'admin', name: 'RuangQu Administrator' });
            navigate('admin');
          } else {
            alert('Email/Password salah! Gunakan: admin@ruangqu.com / admin123');
          }
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#F9F7F2]">
            <Navbar />
            <div className="flex-grow flex items-center justify-center p-4">
              <div className="bg-white p-8 rounded-xl max-w-sm w-full border shadow-md space-y-4">
                <div className="text-center">
                  <div className="w-10 h-10 bg-[#8B5A2B] text-white rounded flex items-center justify-center font-bold mx-auto mb-2 text-xs">RQ</div>
                  <h2 className="text-lg font-medium">Admin Authentication</h2>
                  <p className="text-[11px] text-stone-500">Masuk ke RuangQu Admin Portal</p>
                </div>

                <form onSubmit={handleLogin} className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 font-medium">Email Admin</label>
                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full p-2.5 border rounded-md" />
                  </div>
                  <div>
                    <label className="block mb-1 font-medium">Password</label>
                    <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2.5 border rounded-md" />
                  </div>
                  <button type="submit" className={`w-full py-2.5 text-white rounded-md font-medium ${theme.primary} shadow-md`}>LOGIN KELOLA WEB</button>
                </form>

                <div className="text-center pt-2 border-t text-[10px] text-stone-400">
                  Kredensial Default: admin@ruangqu.com / admin123
                </div>
              </div>
            </div>
            <Footer />
          </div>
        );
      };

      // --- ADMIN DASHBOARD VIEW ---
      const AdminDashboardView = () => {
        const [adminTab, setAdminTab] = useState('overview');
        const [editingPrices, setEditingPrices] = useState({
          individual: products.individual.price,
          group: products.group.price,
          onsite: products.onsite.price
        });

        const handleLogout = () => {
          setAdminProfile(null);
          navigate('home');
        };

        const totalRevenue = bookings.reduce((sum, b) => sum + (b.paymentStatus === 'PAID' ? b.total : 0), 0);

        const handleUpdateBookingStatus = (id, newStatus) => {
          setBookings(prev => prev.map(b => b.id === id ? {
            ...b,
            bookingStatus: newStatus,
            paymentStatus: newStatus === 'CONFIRMED' ? 'PAID' : 'FAILED'
          } : b));
        };

        const handleApproveRequest = (id, fee) => {
          setRequests(prev => prev.map(r => r.id === id ? {
            ...r,
            transportFee: fee,
            total: r.subtotal + fee,
            bookingStatus: 'APPROVED'
          } : r));
        };

        const handleSavePrices = () => {
          setProducts({
            individual: { ...products.individual, price: parseInt(editingPrices.individual) },
            group: { ...products.group, price: parseInt(editingPrices.group) },
            onsite: { ...products.onsite, price: parseInt(editingPrices.onsite) }
          });
          alert('Harga berhasil diperbarui!');
        };

        return (
          <div className="flex min-h-screen bg-[#F4F4F5]">
            {/* SIDEBAR ADMIN */}
            <aside className="w-64 bg-[#2D2A26] text-stone-300 min-h-screen flex flex-col shrink-0">
              <div className="p-5 border-b border-stone-700 flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-7 h-7 bg-[#8B5A2B] text-white rounded flex items-center justify-center font-bold text-xs">RQ</div>
                  <div>
                    <span className="font-semibold text-white text-xs block">ADMIN PORTAL</span>
                    <span className="text-[10px] text-stone-400 block">{adminProfile?.email}</span>
                  </div>
                </div>
              </div>

              <div className="flex-grow py-5 px-3 flex flex-col gap-1 text-xs font-medium">
                <button onClick={() => setAdminTab('overview')} className={`flex items-center gap-2.5 px-3.5 py-2.5 rounded-md transition ${adminTab === 'overview' ? 'bg-[#8B5A2B] text-white' : 'hover:bg-stone-800'}`}>
                  <IconDashboard size={15}/> Overview
                </button>
                <button onClick={() => setAdminTab('schedule')} className={`flex items-center gap-2.5 px-3.5 py-2.5 rounded-md transition ${adminTab === 'schedule' ? 'bg-[#8B5A2B] text-white' : 'hover:bg-stone-800'}`}>
                  <IconCalendar size={15}/> Kelola Jadwal & Sesi
                </button>
                <button onClick={() => setAdminTab('bookings')} className={`flex items-center gap-2.5 px-3.5 py-2.5 rounded-md transition ${adminTab === 'bookings' ? 'bg-[#8B5A2B] text-white' : 'hover:bg-stone-800'}`}>
                  <IconUsers size={15}/> Database Booking ({bookings.length})
                </button>
                <button onClick={() => setAdminTab('requests')} className={`flex items-center gap-2.5 px-3.5 py-2.5 rounded-md transition ${adminTab === 'requests' ? 'bg-[#8B5A2B] text-white' : 'hover:bg-stone-800'}`}>
                  <IconCalendar size={15}/> Permintaan On-Site ({requests.length})
                </button>
                <button onClick={() => setAdminTab('pricing')} className={`flex items-center gap-2.5 px-3.5 py-2.5 rounded-md transition ${adminTab === 'pricing' ? 'bg-[#8B5A2B] text-white' : 'hover:bg-stone-800'}`}>
                  <IconSliders size={15}/> Pengaturan Harga
                </button>
              </div>

              <div className="p-4 border-t border-stone-800">
                <button onClick={handleLogout} className="flex items-center gap-2 text-xs text-red-400 hover:text-red-300 w-full px-2 py-1.5 transition">
                  <IconLogOut size={14}/> Logout Admin
                </button>
              </div>
            </aside>

            {/* MAIN ADMIN CONTENT */}
            <main className="flex-1 overflow-auto p-6 md:p-8">
              {adminTab === 'overview' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-medium text-stone-800">Dashboard Overview</h2>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div className="bg-white p-5 rounded-xl border border-stone-200 shadow-sm">
                      <span className="text-[11px] text-stone-500 uppercase">Total Pendapatan Lunas</span>
                      <p className="text-2xl font-bold text-[#8B5A2B] mt-1">{formatCurrency(totalRevenue)}</p>
                    </div>
                    <div className="bg-white p-5 rounded-xl border border-stone-200 shadow-sm">
                      <span className="text-[11px] text-stone-500 uppercase">Total Transaksi Booking</span>
                      <p className="text-2xl font-bold text-stone-800 mt-1">{bookings.length}</p>
                    </div>
                    <div className="bg-white p-5 rounded-xl border border-stone-200 shadow-sm">
                      <span className="text-[11px] text-stone-500 uppercase">Permintaan On-Site</span>
                      <p className="text-2xl font-bold text-blue-600 mt-1">{requests.length}</p>
                    </div>
                    <div className="bg-white p-5 rounded-xl border border-stone-200 shadow-sm">
                      <span className="text-[11px] text-stone-500 uppercase">Total Sesi Terjadwal</span>
                      <p className="text-2xl font-bold text-green-600 mt-1">{allSessions.length}</p>
                    </div>
                  </div>
                </div>
              )}

              {adminTab === 'schedule' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-medium text-stone-800">Kelola Jadwal & Sesi</h2>
                  <div className="bg-white rounded-xl border border-stone-200 shadow-sm overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-stone-50 text-stone-500 border-b uppercase font-medium">
                        <tr>
                          <th className="p-3">Tanggal</th>
                          <th className="p-3">Nama Sesi</th>
                          <th className="p-3">Jam Sesi</th>
                          <th className="p-3">Tipe</th>
                          <th className="p-3">Kapasitas</th>
                          <th className="p-3">Terisi</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-100">
                        {allSessions.slice(0, 15).map(s => (
                          <tr key={s.id} className="hover:bg-stone-50">
                            <td className="p-3 font-medium">{s.date}</td>
                            <td className="p-3">{s.sessionName}</td>
                            <td className="p-3">{s.startTime} - {s.endTime} WIB</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded bg-stone-100 font-semibold">{s.sessionType}</span></td>
                            <td className="p-3">{s.capacity} Pax</td>
                            <td className="p-3 font-bold text-[#8B5A2B]">{s.booked || 0}</td>
                            <td className="p-3"><span className="px-2 py-0.5 text-[10px] bg-green-100 text-green-700 font-bold rounded">OPEN</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {adminTab === 'bookings' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-medium text-stone-800">Database Booking Masuk</h2>
                  <div className="bg-white rounded-xl border border-stone-200 shadow-sm overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-stone-50 text-stone-500 border-b uppercase font-medium">
                        <tr>
                          <th className="p-3">ID</th>
                          <th className="p-3">Pemesan</th>
                          <th className="p-3">Tipe Kelas</th>
                          <th className="p-3">Tanggal & Jam</th>
                          <th className="p-3">Peserta</th>
                          <th className="p-3">Total</th>
                          <th className="p-3">Status</th>
                          <th className="p-3 text-right">Aksi Admin</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-100">
                        {bookings.map(b => (
                          <tr key={b.id} className="hover:bg-stone-50">
                            <td className="p-3 font-mono font-bold">{b.displayId}</td>
                            <td className="p-3">
                              <p className="font-medium text-stone-900">{b.customerName}</p>
                              <p className="text-[10px] text-stone-400">{b.whatsapp}</p>
                            </td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded bg-amber-50 text-amber-800 font-semibold">{b.bookingType}</span></td>
                            <td className="p-3">{b.date} ({b.time} WIB)</td>
                            <td className="p-3 font-semibold">{b.participants} Pax</td>
                            <td className="p-3 font-bold text-[#8B5A2B]">{formatCurrency(b.total)}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 text-[10px] font-bold rounded ${b.bookingStatus === 'CONFIRMED' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                {b.bookingStatus}
                              </span>
                            </td>
                            <td className="p-3 text-right space-x-2">
                              {b.bookingStatus !== 'CONFIRMED' && (
                                <button onClick={() => handleUpdateBookingStatus(b.id, 'CONFIRMED')} className="text-emerald-600 hover:underline">Tandai Lunas</button>
                              )}
                              {b.bookingStatus === 'CONFIRMED' && (
                                <button onClick={() => handleUpdateBookingStatus(b.id, 'CANCELLED')} className="text-red-500 hover:underline">Batalkan</button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {adminTab === 'requests' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-medium text-stone-800">Permintaan On-Site Workshop</h2>
                  <div className="space-y-4">
                    {requests.map(r => (
                      <div key={r.id} className="bg-white p-5 rounded-xl border border-stone-200 shadow-sm flex flex-col md:flex-row justify-between gap-4">
                        <div className="space-y-1 text-xs">
                          <div className="flex items-center gap-2">
                            <h4 className="font-semibold text-sm text-stone-900">{r.groupName}</h4>
                            <span className="px-2 py-0.5 text-[10px] font-bold bg-blue-100 text-blue-700 rounded">{r.bookingStatus}</span>
                          </div>
                          <p className="text-stone-500">WhatsApp: <span className="text-stone-800 font-medium">{r.whatsapp}</span></p>
                          <p className="text-stone-500">Tanggal & Jam: <span className="text-stone-800 font-medium">{r.eventDate} ({r.eventTime} WIB)</span> • {r.participants} Pax</p>
                          <p className="text-stone-500">Lokasi: <span className="text-stone-800 font-medium">{r.location}</span></p>
                        </div>
                        <div className="text-right text-xs space-y-2">
                          <p className="text-stone-400">Subtotal: {formatCurrency(r.subtotal)}</p>
                          <p className="font-bold text-sm text-[#8B5A2B]">Total: {formatCurrency(r.total)}</p>
                          {r.bookingStatus === 'REQUESTED' && (
                            <button onClick={() => {
                              const fee = prompt('Masukkan Biaya Transportasi (Rp):', '250000');
                              if (fee !== null) handleApproveRequest(r.id, parseInt(fee) || 0);
                            }} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded font-medium">
                              Setujui & Tambah Ongkir
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {adminTab === 'pricing' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-medium text-stone-800">Pengaturan Harga Workshop</h2>
                  <div className="bg-white p-6 rounded-xl border border-stone-200 max-w-md space-y-4 text-xs">
                    <div>
                      <label className="block font-medium mb-1">Harga Individual Class (Rp / Orang)</label>
                      <input type="number" value={editingPrices.individual} onChange={e => setEditingPrices({...editingPrices, individual: e.target.value})} className="w-full p-2.5 border rounded-md" />
                    </div>
                    <div>
                      <label className="block font-medium mb-1">Harga Group Class (Rp / Orang)</label>
                      <input type="number" value={editingPrices.group} onChange={e => setEditingPrices({...editingPrices, group: e.target.value})} className="w-full p-2.5 border rounded-md" />
                    </div>
                    <div>
                      <label className="block font-medium mb-1">Harga On-Site Event Base (Rp / Orang)</label>
                      <input type="number" value={editingPrices.onsite} onChange={e => setEditingPrices({...editingPrices, onsite: e.target.value})} className="w-full p-2.5 border rounded-md" />
                    </div>
                    <button onClick={handleSavePrices} className={`w-full py-2.5 text-white rounded-md font-medium ${theme.primary} shadow-md`}>
                      SIMPAN PERUBAHAN HARGA
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      };

      // --- ROUTER ---
      const views = {
        home: <HomeView />,
        booking: <BookingFlow />,
        onsite: <OnSiteFlow />,
        mock_payment: <MockPaymentCheckout />,
        confirmation: <ConfirmationView />,
        lookup: <LookupView />,
        admin_login: <AdminLoginView />,
        admin: <AdminDashboardView />
      };

      return (
        <div className="min-h-screen">
          {views[currentView] || <HomeView />}
        </div>
      );
    }

    // SAFE RENDER
    const rootElement = document.getElementById('root');
    if (rootElement) {
      ReactDOM.createRoot(rootElement).render(<App />);
    }
  </script>
</body>
</html>
