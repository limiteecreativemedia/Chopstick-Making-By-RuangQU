<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chopstick Making by RuangQu</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- React 18 UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Firebase v10 Compat SDKs (Reliable browser execution without bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F9F7F2;
      color: #2D2A26;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = React;

    // --- FIREBASE INITIALIZATION SAFEGUARD ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyDemoKeyPlaceholderRuangQu2026",
          authDomain: "chopstick-makerspace.firebaseapp.com",
          projectId: "chopstick-makerspace",
          storageBucket: "chopstick-makerspace.appspot.com",
          messagingSenderId: "000000000000",
          appId: "1:000000000000:web:000000000000"
        };

    let auth, db;
    let isFirebaseReady = false;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();
      db = firebase.firestore();
      isFirebaseReady = true;
    } catch (err) {
      console.warn("Firebase initialization warning (running with active local state):", err);
    }

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'chopstick-making-app';

    // Firestore Path Helpers
    const getCol = (colName) => {
      if (!isFirebaseReady || !db) return null;
      return db.collection('artifacts').doc(appId).collection('public').doc('data').collection(colName);
    };

    const getDocRef = (colName, docId) => {
      if (!isFirebaseReady || !db) return null;
      return db.collection('artifacts').doc(appId).collection('public').doc('data').collection(colName).doc(docId);
    };

    // Formatting & Utility Helpers
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);
    };

    const formatDate = (dateString) => {
      if (!dateString) return '';
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('en-US', options);
    };

    const generateBookingId = () => 'CHP-' + Math.floor(10000 + Math.random() * 90000);
    const HOLD_DURATION_MS = 15 * 60 * 1000; // 15 Minutes

    const theme = {
      bg: 'bg-[#F9F7F2]',
      text: 'text-[#2D2A26]',
      textMuted: 'text-[#5C5A56]',
      primary: 'bg-[#8B5A2B]',
      primaryHover: 'hover:bg-[#704822]',
      secondary: 'bg-[#E8E1D5]',
      border: 'border-[#E8E1D5]',
      card: 'bg-white',
    };

    const Icon = ({ path, size = 18, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {path}
      </svg>
    );

    const Calendar = (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />;
    const Clock = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />;
    const Users = (p) => <Icon {...p} path={<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />;
    const ArrowRight = (p) => <Icon {...p} path={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />;
    const CheckCircle2 = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />;
    const ChevronRight = (p) => <Icon {...p} path={<polyline points="9 18 15 12 9 6"/>} />;
    const Menu = (p) => <Icon {...p} path={<><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>} />;
    const X = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />;
    const MapPin = (p) => <Icon {...p} path={<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>} />;
    const Lock = (p) => <Icon {...p} path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />;
    const Plus = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
    const Edit2 = (p) => <Icon {...p} path={<><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></>} />;
    const LayoutDashboard = (p) => <Icon {...p} path={<><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></>} />;
    const CalendarDays = (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></>} />;
    const Ticket = (p) => <Icon {...p} path={<><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><line x1="13" y1="5" x2="13" y2="19" strokeDasharray="2 2"/></>} />;
    const Building = (p) => <Icon {...p} path={<><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></>} />;
    const LogOut = (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>} />;
    const AlertCircle = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />;
    const CreditCard = (p) => <Icon {...p} path={<><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></>} />;
    const Info = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>} />;
    const Sliders = (p) => <Icon {...p} path={<><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></>} />;

    const PlaceholderImage = ({ label, className = "", style = {} }) => (
      <div className={`flex items-center justify-center bg-[#E8E1D5] text-[#8B5A2B] font-mono text-xs text-center p-4 border border-[#D8C1B5] border-dashed select-none ${className}`} style={style}>
        {label}
      </div>
    );

    const paymentService = {
      mode: 'MOCK',
      createPayment: async ({ bookingId, customerName, customerEmail, customerPhone, amount, description }) => {
        await new Promise(r => setTimeout(r, 500));
        return {
          success: true,
          paymentProvider: 'MOCK',
          paymentId: `MOCK-${bookingId}-${Date.now().toString().slice(-4)}`,
          paymentUrl: `mock-checkout://${bookingId}`,
          status: 'PENDING_PAYMENT',
          paymentExpiresAt: Date.now() + HOLD_DURATION_MS
        };
      },
      verifyAndConfirmBooking: async (bookingDocId, sessionId, participants, onLocalConfirm) => {
        if (isFirebaseReady && db) {
          const bookingRef = getDocRef('bookings', bookingDocId);
          const sessionRef = getDocRef('sessions', sessionId);
          if (bookingRef) {
            await bookingRef.update({
              paymentStatus: 'PAID',
              bookingStatus: 'CONFIRMED',
              paidAt: Date.now()
            });
          }
          if (sessionRef) {
            const snap = await sessionRef.get();
            if (snap.exists) {
              const currentBooked = snap.data().booked || 0;
              await sessionRef.update({ booked: currentBooked + participants });
            }
          }
        }
        if (onLocalConfirm) onLocalConfirm(bookingDocId, sessionId, participants);
      }
    };

    function App() {
      const [authUser, setAuthUser] = useState(null);
      const [adminProfile, setAdminProfile] = useState(null);
      const [currentView, setCurrentView] = useState('home');
      const [activeBooking, setActiveBooking] = useState(null);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      // Default State Seed Data (Guarantees content even without database network)
      const [products, setProducts] = useState({
        individual: { id: 'individual', name: 'Individual Class', price: 175000, min: 1, max: 10, type: 'INDIVIDUAL', active: true },
        group: { id: 'group', name: 'Group Class', price: 150000, min: 10, max: 20, type: 'GROUP', active: true },
        onsite: { id: 'onsite', name: 'We Come To You', price: 200000, min: 10, max: 100, type: 'ON_SITE', active: true }
      });

      const [sessions, setSessions] = useState([
        { id: 's1', date: '2026-09-12', startTime: '10:00', endTime: '11:00', capacity: 10, booked: 2, status: 'OPEN', sessionType: 'INDIVIDUAL' },
        { id: 's2', date: '2026-09-12', startTime: '11:30', endTime: '12:30', capacity: 10, booked: 8, status: 'OPEN', sessionType: 'INDIVIDUAL' },
        { id: 's3', date: '2026-09-12', startTime: '13:00', endTime: '14:00', capacity: 10, booked: 10, status: 'FULL', sessionType: 'INDIVIDUAL' },
        { id: 's4', date: '2026-09-13', startTime: '10:00', endTime: '11:00', capacity: 10, booked: 0, status: 'OPEN', sessionType: 'INDIVIDUAL' },
        { id: 's5', date: '2026-09-13', startTime: '14:00', endTime: '15:00', capacity: 10, booked: 4, status: 'OPEN', sessionType: 'INDIVIDUAL' }
      ]);

      const [bookings, setBookings] = useState([
        { id: 'b1', displayId: 'CHP-88219', customerName: 'Budi Santoso', whatsapp: '08123456789', date: '2026-09-12', time: '10:00', participants: 2, total: 350000, paymentStatus: 'PAID', bookingStatus: 'CONFIRMED', bookingType: 'INDIVIDUAL', createdAt: Date.now() - 3600000 }
      ]);

      const [requests, setRequests] = useState([
        { id: 'r1', customerName: 'Maya Indah', companyName: 'PT Ruang Kreasi', whatsapp: '08198765432', preferredDate: '2026-09-20', preferredTime: '13:00', participants: 15, address: 'SCBD Tower 2, Jakarta Selatan', subtotal: 3000000, transportFee: 250000, total: 3250000, bookingStatus: 'REQUESTED' }
      ]);

      // Initialize Auth
      useEffect(() => {
        if (!isFirebaseReady || !auth) return;
        const initAuth = async () => {
          try {
            if (!auth.currentUser) {
              await auth.signInAnonymously();
            }
          } catch (e) { console.warn("Anon sign-in notice:", e); }
        };
        initAuth();

        const unsub = auth.onAuthStateChanged(user => {
          setAuthUser(user);
          if (user && user.email === 'admin@ruangqu.com') {
            setAdminProfile({ uid: user.uid, email: user.email, name: 'RuangQu Admin', role: 'admin' });
          }
        });
        return () => unsub();
      }, []);

      // Realtime Firebase Synchronization
      useEffect(() => {
        if (!isFirebaseReady || !db) return;

        const unsubP = getCol('products')?.onSnapshot(snap => {
          if (!snap.empty) {
            const pObj = {};
            snap.docs.forEach(d => pObj[d.id] = d.data());
            setProducts(pObj);
          }
        }, err => console.warn(err));

        const unsubS = getCol('sessions')?.onSnapshot(snap => {
          if (!snap.empty) {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setSessions(list.sort((a,b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime)));
          }
        }, err => console.warn(err));

        const unsubB = getCol('bookings')?.onSnapshot(snap => {
          if (!snap.empty) {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setBookings(list.sort((a,b) => (b.createdAt||0) - (a.createdAt||0)));
          }
        }, err => console.warn(err));

        const unsubR = getCol('onSiteRequests')?.onSnapshot(snap => {
          if (!snap.empty) {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setRequests(list.sort((a,b) => (b.createdAt||0) - (a.createdAt||0)));
          }
        }, err => console.warn(err));

        return () => {
          if (unsubP) unsubP();
          if (unsubS) unsubS();
          if (unsubB) unsubB();
          if (unsubR) unsubR();
        };
      }, [authUser]);

      const calculateAvailableSpots = (session) => {
        if (!session) return 0;
        const now = Date.now();
        const activeHolds = bookings.filter(b => b.sessionId === session.id && b.bookingStatus === 'PENDING_PAYMENT' && b.paymentExpiresAt > now)
          .reduce((sum, b) => sum + (b.participants || 0), 0);
        
        const taken = Math.max(session.booked || 0, bookings.filter(b => b.sessionId === session.id && b.bookingStatus === 'CONFIRMED').reduce((s,b) => s + b.participants, 0));
        return Math.max(0, session.capacity - (taken + activeHolds));
      };

      const navigate = (view, data = null) => {
        if (view === 'admin' && !adminProfile) {
          setCurrentView('admin_login');
          return;
        }
        setCurrentView(view);
        if (data) setActiveBooking(data);
        window.scrollTo(0, 0);
        setIsMobileMenuOpen(false);
      };

      // --- STREAMING_CHUNK:Rendering Navigation & Footer... ---
      const Navbar = () => (
        <nav className={`sticky top-0 z-50 ${theme.bg} border-b border-[#E8E1D5] px-4 md:px-8 py-3.5 flex justify-between items-center shadow-sm`}>
          <div className="flex items-center gap-3 cursor-pointer" onClick={() => navigate('home')}>
            <div className={`w-8 h-8 ${theme.primary} rounded flex items-center justify-center text-white font-bold tracking-widest text-xs shadow-inner`}>RQ</div>
            <div>
              <span className="font-semibold tracking-wider text-sm md:text-base block leading-none">CHOPSTICK MAKING</span>
              <span className="text-[10px] text-[#8B5A2B] tracking-widest uppercase">by RuangQu</span>
            </div>
          </div>
          
          <div className="hidden md:flex gap-7 text-xs font-medium tracking-wider">
            <button onClick={() => navigate('home')} className="text-[#5C5A56] hover:text-[#2D2A26] transition">EXPERIENCES</button>
            <button onClick={() => navigate('lookup')} className="text-[#5C5A56] hover:text-[#2D2A26] transition">MANAGE BOOKING</button>
            {adminProfile ? (
              <button onClick={() => navigate('admin')} className="text-[#8B5A2B] font-semibold flex items-center gap-1.5 bg-[#E8E1D5] px-3 py-1.5 rounded-full">
                <LayoutDashboard size={13}/> DASHBOARD
              </button>
            ) : (
              <button onClick={() => navigate('admin_login')} className="text-[#5C5A56] hover:text-[#2D2A26] transition flex items-center gap-1">
                <Lock size={12}/> ADMIN
              </button>
            )}
          </div>

          <div className="md:hidden flex items-center">
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-1">
              {isMobileMenuOpen ? <X size={22} /> : <Menu size={22} />}
            </button>
          </div>

          {isMobileMenuOpen && (
            <div className={`absolute top-[60px] left-0 w-full ${theme.bg} border-b border-[#E8E1D5] flex flex-col p-5 shadow-xl md:hidden z-50`}>
              <button onClick={() => navigate('home')} className="py-3 text-left border-b border-stone-200 text-sm font-medium">Experiences</button>
              <button onClick={() => navigate('lookup')} className="py-3 text-left border-b border-stone-200 text-sm font-medium">Manage Your Booking</button>
              {adminProfile ? (
                <button onClick={() => navigate('admin')} className="py-3 text-left text-[#8B5A2B] font-semibold text-sm flex items-center gap-2">
                  <LayoutDashboard size={16}/> Admin Dashboard
                </button>
              ) : (
                <button onClick={() => navigate('admin_login')} className="py-3 text-left text-sm flex items-center gap-2 text-stone-600">
                  <Lock size={16}/> Admin Login
                </button>
              )}
            </div>
          )}
        </nav>
      );

      const Footer = () => (
        <footer className={`${theme.primary} text-white py-12 px-6 text-center mt-auto`}>
          <div className="max-w-4xl mx-auto flex flex-col items-center gap-5">
            <div className="w-10 h-10 bg-white/10 rounded flex items-center justify-center text-sm font-bold tracking-widest">RQ</div>
            <p className="text-white/80 max-w-md text-xs md:text-sm leading-relaxed">
              A hands-on woodworking experience where you shape, smooth and personalize your own pair of wooden chopsticks.
            </p>
            <div className="text-white/50 text-[11px] mt-4 border-t border-white/10 pt-4 w-full">
              &copy; {new Date().getFullYear()} RuangQu Makerspace. All rights reserved. • Approx. 45–60 mins per session
            </div>
          </div>
        </footer>
      );

      // --- STREAMING_CHUNK:Rendering Homepage View... ---
      const HomeView = () => (
        <div className="flex flex-col min-h-screen">
          <Navbar />
          
          <section className="relative pt-10 pb-16 md:py-20 px-4 md:px-8 max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-10 md:gap-12">
            <div className="flex-1 space-y-5 text-center md:text-left">
              <div className="inline-flex items-center gap-2 px-3 py-1 bg-[#E8E1D5] text-[#8B5A2B] text-[11px] font-semibold tracking-widest rounded-full">
                <span>RUANGQU MAKERSPACE</span> • <span>JAKARTA</span>
              </div>
              <h1 className="text-4xl md:text-6xl font-light tracking-tight text-[#2D2A26] leading-tight">
                Make your own <br/><span className="font-serif italic font-normal">chopsticks.</span>
              </h1>
              <p className="text-sm md:text-base text-[#5C5A56] max-w-md mx-auto md:mx-0 leading-relaxed">
                Shape it. Smooth it. Make it yours. A hands-on woodworking experience taking approximately 45–60 minutes.
              </p>
              <div className="flex flex-col sm:flex-row gap-3.5 pt-2 justify-center md:justify-start">
                <button onClick={() => document.getElementById('experiences').scrollIntoView({ behavior: 'smooth' })} className={`${theme.primary} ${theme.primaryHover} text-white px-7 py-3.5 rounded-md font-medium text-xs tracking-wider transition flex items-center justify-center gap-2 shadow-md`}>
                  BOOK YOUR EXPERIENCE <ArrowRight size={16} />
                </button>
                <button onClick={() => document.getElementById('how-it-works').scrollIntoView({ behavior: 'smooth' })} className="border border-[#2D2A26] text-[#2D2A26] hover:bg-stone-100 px-6 py-3.5 rounded-md font-medium text-xs tracking-wider transition">
                  HOW IT WORKS
                </button>
              </div>
            </div>
            <div className="flex-1 w-full relative max-w-lg md:max-w-none">
              <PlaceholderImage label="RUANGQU WOODWORKING STUDIO" className="w-full aspect-[4/3] rounded-lg shadow-xl" />
              <div className="absolute -bottom-4 -left-4 md:-bottom-6 md:-left-6 bg-white p-3.5 md:p-4 rounded-lg shadow-lg flex items-center gap-3 border border-[#E8E1D5]">
                <div className="bg-[#E8E1D5] text-[#8B5A2B] p-2 rounded-full"><Clock size={18}/></div>
                <div>
                  <p className="text-[10px] text-stone-500 uppercase tracking-wider">Duration</p>
                  <p className="font-semibold text-xs md:text-sm">45–60 Minutes</p>
                </div>
              </div>
            </div>
          </section>

          <section id="experiences" className="py-16 md:py-20 px-4 bg-white border-y border-[#E8E1D5]">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-2xl md:text-3xl font-medium tracking-tight mb-2">Choose Your Experience</h2>
                <p className="text-xs md:text-sm text-[#5C5A56] max-w-md mx-auto">Select a public workshop, reserve a private group session, or have us come to your venue.</p>
              </div>

              <div className="grid md:grid-cols-3 gap-6 md:gap-8">
                {/* Individual */}

      // --- STREAMING_CHUNK:Building Individual Booking Flow View... ---
      const IndividualBookingFlow = () => {
        const [step, setStep] = useState(1);
        const [selectedDate, setSelectedDate] = useState('');
        const [selectedSession, setSelectedSession] = useState(null);
        const [participants, setParticipants] = useState(1);
        const [formData, setFormData] = useState({ name: '', whatsapp: '', email: '', notes: '' });
        const [errorMsg, setErrorMsg] = useState('');

        const product = products.individual || { price: 175000 };
        const uniqueDates = [...new Set(sessions.map(s => s.date))].sort();
        const availableSessions = sessions.filter(s => s.date === selectedDate);

        const handleContinueToDetails = () => {
          if (!selectedSession) return;
          const remaining = calculateAvailableSpots(selectedSession);
          if (remaining <= 0) {
            setErrorMsg("Sorry, this session is full.");
            return;
          }
          setStep(2);
        };

        const handleCreateBooking = async () => {
          if (!formData.name || !formData.whatsapp) {
            setErrorMsg("Full Name and WhatsApp number are required.");
            return;
          }

          const bookingId = generateBookingId();
          const total = participants * product.price;

          const paymentResp = await paymentService.createPayment({
            bookingId,
            customerName: formData.name,
            amount: total
          });

          const bookingRecord = {
            id: 'b-' + Date.now(),
            bookingId,
            displayId: bookingId,
            customerName: formData.name,
            whatsapp: formData.whatsapp,
            email: formData.email,
            notes: formData.notes,
            bookingType: 'INDIVIDUAL',
            sessionId: selectedSession.id,
            date: selectedSession.date,
            time: selectedSession.startTime,
            participants,
            pricePerPerson: product.price,
            total,
            bookingStatus: 'PENDING_PAYMENT',
            paymentStatus: 'PENDING',
            paymentExpiresAt: paymentResp.paymentExpiresAt,
            createdAt: Date.now()
          };

          if (isFirebaseReady && db) {
            const docRef = getCol('bookings').doc();
            bookingRecord.id = docRef.id;
            await docRef.set(bookingRecord);
          } else {
            setBookings([bookingRecord, ...bookings]);
          }

          navigate('mock_payment', bookingRecord);
        };

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="max-w-3xl mx-auto w-full px-4 py-8 flex-grow">
              <button onClick={() => step > 1 ? setStep(step-1) : navigate('home')} className="flex items-center gap-1.5 text-xs font-medium mb-6 hover:opacity-75 transition">
                <ChevronRight className="rotate-180" size={14}/> Back to {step > 1 ? 'Schedule Selection' : 'Home'}
              </button>
              
              <div className="bg-white p-6 md:p-10 rounded-xl shadow-sm border border-[#E8E1D5]">
                <h2 className="text-2xl font-medium mb-1">Individual Class Booking</h2>
                <p className="text-xs text-[#5C5A56] mb-6">{formatCurrency(product.price)} / person • Approx. 45–60 mins</p>

                {errorMsg && <div className="bg-red-50 text-red-700 p-3 rounded-md text-xs mb-4">{errorMsg}</div>}

                {step === 1 && (
                  <div className="space-y-6">
                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">1. Choose Date</label>
                      <div className="flex flex-wrap gap-2.5">
                        {uniqueDates.map(date => (
                          <button 
                            key={date}
                            onClick={() => { setSelectedDate(date); setSelectedSession(null); }}
                            className={`px-3.5 py-2 border rounded-md text-xs font-medium transition ${selectedDate === date ? 'border-[#8B5A2B] bg-[#F9F7F2] text-[#8B5A2B]' : 'border-stone-200'}`}
                          >
                            {formatDate(date).split(',')[0]}, {formatDate(date).split(' ')[1]} {formatDate(date).split(' ')[2]?.replace(',','')}
                          </button>
                        ))}
                      </div>
                    </div>

                    {selectedDate && (
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">2. Choose Time Slot</label>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                          {availableSessions.map(session => {
                            const remaining = calculateAvailableSpots(session);
                            const isFull = remaining <= 0;
                            const isSelected = selectedSession?.id === session.id;

                            return (
                              <button 
                                key={session.id}
                                disabled={isFull}
                                onClick={() => setSelectedSession(session)}
                                className={`p-3 border rounded-lg flex flex-col items-center transition ${isFull ? 'opacity-40 bg-stone-50 cursor-not-allowed' : isSelected ? 'border-[#8B5A2B] bg-[#F9F7F2] text-[#8B5A2B]' : 'border-stone-200'}`}
                              >
                                <span className="font-semibold text-sm">{session.startTime}</span>
                                <span className={`text-[10px] mt-1 font-medium ${isFull ? 'text-red-500' : 'text-green-600'}`}>{isFull ? 'FULL' : `${remaining} spots left`}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {selectedSession && (
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-2">3. Number of Participants</label>
                        <select 
                          value={participants} 
                          onChange={(e) => setParticipants(parseInt(e.target.value))}
                          className="w-full md:w-1/2 p-2.5 border rounded-md text-sm bg-white"
                        >
                          {Array.from({ length: Math.min(10, calculateAvailableSpots(selectedSession)) }, (_, i) => i + 1).map(n => (
                            <option key={n} value={n}>{n} {n === 1 ? 'Participant' : 'Participants'} ({formatCurrency(n * product.price)})</option>
                          ))}
                        </select>
                      </div>
                    )}

                    <button 
                      disabled={!selectedSession}
                      onClick={handleContinueToDetails}
                      className={`w-full py-3.5 rounded-md font-medium text-xs tracking-wider transition ${selectedSession ? `${theme.primary} text-white shadow-md` : 'bg-stone-200 text-stone-400 cursor-not-allowed'}`}
                    >
                      CONTINUE TO DETAILS
                    </button>
                  </div>
                )}

                {step === 2 && (
                  <div className="space-y-4">
                    <div className="bg-[#F9F7F2] p-4 rounded-lg border border-[#E8E1D5] flex justify-between items-center text-xs">
                      <div>
                        <p className="font-semibold text-stone-800">{formatDate(selectedSession.date)}</p>
                        <p className="text-stone-500">{selectedSession.startTime} WIB • {participants} Participants</p>
                      </div>
                      <button onClick={() => setStep(1)} className="text-[#8B5A2B] underline">Change</button>
                    </div>

                    <div>
                      <label className="block text-xs font-medium mb-1">Full Name *</label>
                      <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" placeholder="e.g. Budi Santoso" />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium mb-1">WhatsApp Number *</label>
                        <input type="tel" required value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" placeholder="e.g. 08123456789" />
                      </div>
                      <div>
                        <label className="block text-xs font-medium mb-1">Email Address</label>
                        <input type="email" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full p-2.5 border rounded-md text-sm" placeholder="name@email.com" />
                      </div>
                    </div>

                    <div className="border-t border-stone-200 pt-4">
                      <div className="flex justify-between font-semibold text-base text-stone-900">
                        <span>Total Payment</span>
                        <span className="text-[#8B5A2B]">{formatCurrency(participants * product.price)}</span>
                      </div>
                    </div>

                    <button 
                      onClick={handleCreateBooking}
                      className={`w-full py-3.5 rounded-md font-medium text-xs tracking-wider text-white shadow-md ${theme.primary} ${theme.primaryHover}`}
                    >
                      PROCEED TO PAYMENT ({formatCurrency(participants * product.price)})
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // --- STREAMING_CHUNK:Building Group & OnSite Flow Views... ---
      const GroupBookingFlow = () => {
        const [selectedDate, setSelectedDate] = useState('');
        const [selectedSession, setSelectedSession] = useState(null);
        const [participants, setParticipants] = useState(10);
        const [formData, setFormData] = useState({ name: '', whatsapp: '' });

        const product = products.group || { price: 150000 };
        const uniqueDates = [...new Set(sessions.map(s => s.date))].sort();

        const handleGroupBooking = () => {
          if (!formData.name || !formData.whatsapp || !selectedSession) return;
          const bookingId = generateBookingId();
          const total = participants * product.price;

          const record = {
            id: 'b-' + Date.now(),
            bookingId, displayId: bookingId, customerName: formData.name, whatsapp: formData.whatsapp,
            bookingType: 'GROUP', sessionId: selectedSession.id, date: selectedSession.date, time: selectedSession.startTime,
            participants, pricePerPerson: product.price, total, bookingStatus: 'PENDING_PAYMENT', paymentStatus: 'PENDING',
            paymentExpiresAt: Date.now() + HOLD_DURATION_MS, createdAt: Date.now()
          };

          if (isFirebaseReady && db) getCol('bookings').doc().set(record);
          else setBookings([record, ...bookings]);

          navigate('mock_payment', record);
        };

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="max-w-3xl mx-auto w-full px-4 py-8 flex-grow">
              <button onClick={() => navigate('home')} className="flex items-center gap-1.5 text-xs font-medium mb-6"><ChevronRight className="rotate-180" size={14}/> Back to Home</button>
              <div className="bg-white p-6 md:p-10 rounded-xl shadow-sm border border-[#E8E1D5]">
                <h2 className="text-2xl font-medium mb-1">Book Private Group Class</h2>
                <p className="text-xs text-[#5C5A56] mb-6">{formatCurrency(product.price)} / person • Min. 10 to Max. 20 participants</p>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium mb-1">Select Date</label>
                    <div className="flex flex-wrap gap-2">
                      {uniqueDates.map(d => (
                        <button key={d} onClick={() => setSelectedDate(d)} className={`px-3 py-1.5 border rounded text-xs ${selectedDate === d ? 'border-[#8B5A2B] bg-[#F9F7F2]' : ''}`}>{d}</button>
                      ))}
                    </div>
                  </div>

                  {selectedDate && (
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                      {sessions.filter(s => s.date === selectedDate).map(s => (
                        <button key={s.id} onClick={() => setSelectedSession(s)} className={`p-2.5 border rounded text-center text-xs ${selectedSession?.id === s.id ? 'border-[#8B5A2B] bg-[#F9F7F2]' : ''}`}>{s.startTime}</button>
                      ))}
                    </div>
                  )}

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div>
                      <label className="block text-xs font-medium mb-1">Group Lead Name *</label>
                      <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2.5 border rounded text-sm" placeholder="e.g. PT Ruang Kreasi" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1">WhatsApp Number *</label>
                      <input type="tel" required value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value})} className="w-full p-2.5 border rounded text-sm" placeholder="e.g. 08123456789" />
                    </div>
                  </div>

                  <button onClick={handleGroupBooking} disabled={!selectedSession} className={`w-full py-3 rounded text-xs font-medium text-white ${theme.primary} mt-4`}>
                    CONFIRM & PAY GROUP ({formatCurrency(participants * product.price)})
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const OnSiteFlow = () => {
        const [formData, setFormData] = useState({ customerName: '', companyName: '', whatsapp: '', participants: 10, preferredDate: '', address: '', notes: '' });
        const [submitted, setSubmitted] = useState(false);

        const handleSubmit = (e) => {
          e.preventDefault();
          const record = { ...formData, subtotal: formData.participants * (products.onsite?.price || 200000), total: formData.participants * (products.onsite?.price || 200000), bookingStatus: 'REQUESTED', createdAt: Date.now() };
          if (isFirebaseReady && db) getCol('onSiteRequests').doc().set(record);
          else setRequests([record, ...requests]);
          setSubmitted(true);
        };

        if (submitted) {
          return (
            <div className={`min-h-screen flex flex-col ${theme.bg}`}>
              <Navbar />
              <div className="flex-grow flex items-center justify-center p-4">
                <div className="bg-white p-8 rounded-xl text-center max-w-md border border-stone-200">
                  <CheckCircle2 size={36} className="text-green-600 mx-auto mb-3"/>
                  <h3 className="text-lg font-medium mb-2">Request Submitted</h3>
                  <p className="text-xs text-stone-500 mb-5">Our team will review your location, set transport fee and contact your WhatsApp.</p>
                  <button onClick={() => navigate('home')} className={`${theme.primary} text-white px-5 py-2 rounded text-xs`}>Back to Homepage</button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="max-w-2xl mx-auto w-full px-4 py-8 flex-grow">
              <button onClick={() => navigate('home')} className="flex items-center gap-1 text-xs mb-6"><ChevronRight className="rotate-180" size={14}/> Back to Home</button>
              <div className="bg-white p-6 md:p-8 rounded-xl border border-[#E8E1D5]">
                <h2 className="text-xl font-medium mb-4">Request On-Site Event</h2>
                <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                  <input required placeholder="Contact Name *" value={formData.customerName} onChange={e => setFormData({...formData, customerName: e.target.value})} className="w-full p-2.5 border rounded" />
                  <input required placeholder="WhatsApp Number *" value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value})} className="w-full p-2.5 border rounded" />
                  <input required type="date" value={formData.preferredDate} onChange={e => setFormData({...formData, preferredDate: e.target.value})} className="w-full p-2.5 border rounded" />
                  <textarea required placeholder="Full Venue Address in Jabodetabek *" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} className="w-full p-2.5 border rounded" rows="2"></textarea>
                  <button type="submit" className={`w-full py-3 text-white rounded font-medium ${theme.primary}`}>SUBMIT REQUEST</button>
                </form>
              </div>
            </div>
          </div>
        );
      };

      // --- STREAMING_CHUNK:Building Payment Gateway & Lookup Views... ---
      const MockPaymentCheckout = () => {
        const [timeLeft, setTimeLeft] = useState(15 * 60);

        useEffect(() => {
          const t = setInterval(() => setTimeLeft(prev => Math.max(0, prev - 1)), 1000);
          return () => clearInterval(t);
        }, []);

        const handleSuccess = async () => {
          await paymentService.verifyAndConfirmBooking(activeBooking.id, activeBooking.sessionId, activeBooking.participants, (bId, sId, pax) => {
            setBookings(bookings.map(b => b.id === bId ? { ...b, bookingStatus: 'CONFIRMED', paymentStatus: 'PAID' } : b));
            setSessions(sessions.map(s => s.id === sId ? { ...s, booked: (s.booked || 0) + pax } : s));
          });
          navigate('confirmation', { ...activeBooking, bookingStatus: 'CONFIRMED', paymentStatus: 'PAID' });
        };

        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="flex-grow flex items-center justify-center p-4 py-8">
              <div className="bg-white p-6 rounded-xl max-w-md w-full border border-stone-200 shadow-lg">
                <div className="flex justify-between items-center border-b pb-3 mb-4">
                  <span className="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">MAYAR CHECKOUT MOCK</span>
                  <span className="font-mono text-xs font-bold text-red-600">{m}:{s < 10 ? '0' : ''}{s}</span>
                </div>
                <div className="text-xs space-y-2 mb-6">
                  <div className="flex justify-between"><span className="text-stone-500">Booking ID:</span><span className="font-mono font-bold">{activeBooking?.displayId}</span></div>
                  <div className="flex justify-between"><span className="text-stone-500">Name:</span><span>{activeBooking?.customerName}</span></div>
                  <div className="flex justify-between font-bold text-sm border-t pt-2"><span>Total Amount:</span><span className="text-[#8B5A2B]">{formatCurrency(activeBooking?.total)}</span></div>
                </div>
                <button onClick={handleSuccess} className="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded text-xs font-medium flex justify-center items-center gap-2">
                  <CreditCard size={14}/> SIMULATE SUCCESSFUL PAYMENT
                </button>
              </div>
            </div>
          </div>
        );
      };

      const ConfirmationView = () => (
        <div className={`min-h-screen flex flex-col ${theme.bg}`}>
          <Navbar />
          <div className="flex-grow flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-xl text-center max-w-md w-full border border-[#E8E1D5] shadow-sm">
              <CheckCircle2 size={40} className="text-green-600 mx-auto mb-3"/>

              <p className="text-xs text-stone-500 mb-5">Your spot at RuangQu Makerspace is locked.</p>
              <div className="bg-[#F9F7F2] p-4 rounded text-xs text-left mb-6 space-y-1.5 font-mono">
                <p>ID: <strong>{activeBooking?.displayId}</strong></p>
                <p>Date: {activeBooking?.date} at {activeBooking?.time} WIB</p>
                <p>Pax: {activeBooking?.participants} Person(s)</p>
              </div>
              <button onClick={() => navigate('home')} className={`${theme.primary} text-white px-6 py-2.5 rounded text-xs`}>Return to Home</button>
            </div>
          </div>
        </div>
      );

      const LookupView = () => {
        const [id, setId] = useState('');
        const [phone, setPhone] = useState('');
        const [match, setMatch] = useState(null);

        const handleSearch = (e) => {
          e.preventDefault();
          const found = bookings.find(b => b.displayId === id.trim().toUpperCase() && b.whatsapp === phone.trim());
          setMatch(found || 'NOT_FOUND');
        };

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="max-w-md mx-auto w-full p-4 py-12 flex-grow">
              <h2 className="text-xl font-medium mb-4 text-center">Manage Your Booking</h2>
              <form onSubmit={handleSearch} className="bg-white p-6 rounded-xl border border-stone-200 shadow-sm space-y-3 mb-6">
                <input required placeholder="Booking ID (e.g. CHP-88219)" value={id} onChange={e => setId(e.target.value)} className="w-full p-2.5 border rounded text-xs uppercase font-mono" />
                <input required placeholder="Registered WhatsApp (e.g. 08123456789)" value={phone} onChange={e => setPhone(e.target.value)} className="w-full p-2.5 border rounded text-xs" />
                <button type="submit" className={`w-full py-2.5 text-white rounded text-xs font-medium ${theme.primary}`}>SEARCH BOOKING</button>
              </form>

              {match === 'NOT_FOUND' && <p className="text-xs text-red-600 text-center">No matching booking found.</p>}
              {match && match !== 'NOT_FOUND' && (
                <div className="bg-white p-5 rounded-xl border border-stone-200 text-xs space-y-2">
                  <p className="font-mono font-bold text-stone-900">{match.displayId}</p>
                  <p>Customer: {match.customerName}</p>
                  <p>Schedule: {match.date} • {match.time} WIB</p>
                  <p>Status: <span className="font-bold text-green-700">{match.bookingStatus}</span></p>
                </div>
              )}
            </div>
          </div>
        );
      };

      // --- STREAMING_CHUNK:Building Admin Login & Dashboard Views... ---
      const AdminLoginView = () => {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');

        const handleLogin = (e) => {
          e.preventDefault();
          if (email === 'admin@ruangqu.com' && password === 'admin123') {
            setAdminProfile({ email, role: 'admin' });
            navigate('admin');
          } else {
            alert('Invalid admin credentials. Use admin@ruangqu.com / admin123');
          }
        };

        return (
          <div className={`min-h-screen flex flex-col ${theme.bg}`}>
            <Navbar />
            <div className="flex-grow flex items-center justify-center p-4">
              <form onSubmit={handleLogin} className="bg-white p-8 rounded-xl max-w-sm w-full border border-stone-200 shadow-sm space-y-4">
                <h3 className="text-lg font-medium text-center">Admin Portal Login</h3>
                <input required type="email" placeholder="admin@ruangqu.com" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-2.5 border rounded text-xs" />
                <input required type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2.5 border rounded text-xs" />
                <button type="submit" className={`w-full py-2.5 text-white rounded text-xs font-medium ${theme.primary}`}>LOGIN</button>
                <p className="text-[10px] text-stone-400 text-center">Demo: admin@ruangqu.com / admin123</p>
              </form>
            </div>
          </div>
        );
      };

      const AdminDashboardView = () => (
        <div className="flex min-h-screen bg-[#F4F4F5]">
          <aside className="w-64 bg-[#2D2A26] text-stone-300 p-5 flex flex-col justify-between shrink-0">
            <div>
              <div className="flex items-center gap-2 mb-8">
                <div className="w-6 h-6 bg-[#8B5A2B] text-white font-bold rounded flex items-center justify-center text-xs">RQ</div>
                <span className="font-semibold text-white text-xs">ADMIN DASHBOARD</span>
              </div>
              <p className="text-[11px] text-stone-400">Total Bookings: {bookings.length}</p>
              <p className="text-[11px] text-stone-400">On-Site Requests: {requests.length}</p>
            </div>
            <button onClick={() => { setAdminProfile(null); navigate('home'); }} className="text-xs text-red-400 flex items-center gap-1"><LogOut size={14}/> Logout</button>
          </aside>
          <main className="flex-1 p-8 overflow-auto text-xs space-y-6">
            <h2 className="text-lg font-medium">Bookings Database</h2>
            <div className="bg-white rounded-xl border border-stone-200 overflow-x-auto">
              <table className="w-full text-left">
                <thead className="bg-stone-50 border-b">
                  <tr><th className="p-3">ID</th><th className="p-3">Customer</th><th className="p-3">Date</th><th className="p-3">Pax</th><th className="p-3">Total</th><th className="p-3">Status</th></tr>
                </thead>
                <tbody className="divide-y">
                  {bookings.map(b => (
                    <tr key={b.id} className="hover:bg-stone-50">
                      <td className="p-3 font-mono font-bold">{b.displayId}</td>
                      <td className="p-3">{b.customerName}<br/><span className="text-stone-400">{b.whatsapp}</span></td>
                      <td className="p-3">{b.date} • {b.time}</td>
                      <td className="p-3">{b.participants}</td>
                      <td className="p-3 font-semibold text-[#8B5A2B]">{formatCurrency(b.total)}</td>
                      <td className="p-3"><span className="px-2 py-0.5 rounded bg-green-100 text-green-800 font-bold">{b.bookingStatus}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </main>
        </div>
      );

      const views = {
        home: <HomeView />,
        individual: <IndividualBookingFlow />,
        group: <GroupBookingFlow />,
        onsite: <OnSiteFlow />,
        mock_payment: <MockPaymentCheckout />,
        confirmation: <ConfirmationView />,
        lookup: <LookupView />,
        admin_login: <AdminLoginView />,
        admin: <AdminDashboardView />
      };

      return views[currentView] || <HomeView />;
    }

    // --- STREAMING_CHUNK:Mounting React Application with Error Boundary Safety... ---
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("App boundary caught error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-[#F9F7F2] text-center">
              <div className="bg-white p-8 rounded-xl shadow-md border border-stone-200 max-w-md">
                <AlertCircle size={40} className="text-amber-600 mx-auto mb-3"/>
                <h3 className="text-lg font-medium text-stone-800 mb-2">Notice</h3>
                <p className="text-xs text-stone-500 mb-4">{this.state.error?.toString()}</p>
                <button onClick={() => window.location.reload()} className="bg-[#8B5A2B] text-white px-5 py-2 rounded text-xs font-medium">Reload Application</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
